<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Manutenção">
<title>Barreto Manutenção</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="theme-color" content="#0B2A6B">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/favicon.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700;800&family=Barlow+Semi+Condensed:wght@700;800&display=swap">
<style>
/* Tema único claro, igual ao esboço. Layout: barra lateral + conteúdo + painel de totais no computador; cabeçalho + navegação inferior no celular */
:root{
  --navy:#0B2A6B; --navy-ink:#061A45; --orange:#FF9100; --on-orange:#172033;
  --bg:#F3F5F9; --surface:#FFFFFF; --surface-2:#EEF1F7; --line:#E2E6EE; --line-2:#CDD3DF;
  --fg:#172033; --fg-2:#3A4458; --muted:#5B6478; --heading:#0B2A6B;
  --primary:#0B2A6B; --on-primary:#FFFFFF; --bar:#0B2A6B; --on-bar:#FFFFFF; --on-bar-2:#C9D3EA;
  --ok-bg:#E3F4EA; --ok:#1A6B3A; --warn-bg:#FFF1DB; --warn:#8A4B00; --bad-bg:#FDE7E6; --bad:#A1231B;
  --info-bg:#E7ECF7; --info:#1E3A7A; --sel:#EEF2FA; --logo-bg:transparent; --shadow:0 1px 2px rgba(11,42,107,.08);
  --plate-inv-bg:#FFFFFF; --plate-inv-fg:#0B2A6B; --bar-hover:rgba(255,255,255,.12);
  color-scheme:light;
  --f-display:"Barlow Semi Condensed","Barlow","Arial Narrow",system-ui,sans-serif;
  --f-body:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;
}

*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:15px;line-height:1.4}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--surface)}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--heading)}
:focus-visible{outline:3px solid var(--orange);outline-offset:2px}
h1,h2,h3{margin:0;text-wrap:balance}
.num{font-variant-numeric:tabular-nums}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}

/* estrutura */
.shell{display:flex;min-height:100%}
.side{width:236px;flex:none;background:var(--surface);border-right:1px solid var(--line);padding:20px 12px;display:flex;flex-direction:column;gap:2px;position:sticky;top:0;height:100vh;overflow:auto}
.side .logo{margin:0 8px 18px;background:var(--logo-bg);border-radius:8px;padding:4px 6px}
.side .logo img{display:block;width:180px;height:auto}
.nav-i{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:8px;border:0;background:none;color:var(--fg-2);font-weight:600;font-size:15px;text-align:left;cursor:pointer;width:100%}
.nav-i:hover{background:var(--surface-2)}
.nav-i[aria-current="page"]{background:var(--primary);color:var(--on-primary)}
.nav-i .badge{margin-left:auto}
.side .sep{height:1px;background:var(--line);margin:10px 8px}
.side .who{margin-top:auto;padding:12px;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:6px}
.main{flex:1;min-width:0;display:flex;flex-direction:column}
.content{flex:1;width:100%;max-width:1180px;margin:0 auto;padding-block:22px 40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:16px}
.with-panel{display:flex;gap:20px;align-items:flex-start}
.with-panel>.col{flex:1;min-width:0;display:flex;flex-direction:column;gap:16px}
.panel{width:290px;flex:none;display:flex;flex-direction:column;gap:12px;position:sticky;top:22px}
.mtop{display:none}
.bnav{display:none}
.fab{display:none}
@media (max-width:1180px){.panel{display:none}}
@media (max-width:820px){
  .side{display:none}
  .mtop{display:flex;align-items:center;justify-content:space-between;gap:10px;position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line);padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
  .mtop .logo{background:var(--logo-bg);border-radius:6px;padding:2px 4px}
  .mtop img{height:28px;width:auto;display:block}
  .content{padding-bottom:calc(150px + env(safe-area-inset-bottom,0px));padding-top:16px}
  .bnav{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
  .bnav button{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:3px;padding:10px 0 8px;font-size:12px;font-weight:600;color:var(--muted);position:relative;cursor:pointer;min-height:60px}
  .bnav button[aria-current="page"]{color:var(--heading);font-weight:800}
  .bnav .badge{position:absolute;top:6px;left:58%}
  .fab{display:flex;position:fixed;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(76px + env(safe-area-inset-bottom,0px));z-index:21;height:56px;padding:0 22px;border-radius:28px;border:0;background:var(--primary);color:var(--on-primary);align-items:center;gap:8px;font-weight:800;font-size:16px;box-shadow:0 6px 16px rgba(11,42,107,.3);cursor:pointer}
  .hide-m{display:none!important}
}

/* componentes */
.page-h{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.page-h h1{font-family:var(--f-display);font-size:30px;font-weight:800;color:var(--heading);letter-spacing:.2px}
.page-h .sub{color:var(--muted);font-size:14px}
.page-h .right{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}
.card{background:var(--surface);border-radius:14px;box-shadow:var(--shadow);border:1px solid var(--line)}
.card.pad{padding:16px}
.card h2{font-size:17px;font-weight:800}
.stack{display:flex;flex-direction:column;gap:10px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.btn{height:44px;padding:0 16px;border-radius:10px;border:1px solid var(--line-2);background:var(--surface);color:var(--heading);font-weight:700;font-size:15px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px;text-decoration:none;white-space:nowrap}
.btn:hover{background:var(--surface-2)}
.btn.primary{background:var(--primary);border-color:var(--primary);color:var(--on-primary)}
.btn.primary:hover{filter:brightness(1.1)}
.btn.orange{background:var(--orange);border-color:var(--orange);color:var(--on-orange)}
.btn.danger{color:var(--bad)}
.btn.sm{height:36px;padding:0 12px;font-size:14px;border-radius:8px}
.btn.block{width:100%;height:52px;font-size:16px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.plate{font-weight:800;letter-spacing:.6px;font-size:14px;background:var(--surface-2);border:1px solid var(--line-2);border-radius:6px;padding:1px 8px;white-space:nowrap;color:var(--fg)}
.pill{display:inline-flex;align-items:center;font-size:12px;font-weight:700;border-radius:20px;padding:3px 10px;white-space:nowrap}
.pill.neutral{background:var(--surface-2);color:var(--fg-2)}
.pill.info{background:var(--info-bg);color:var(--info)}
.pill.warn{background:var(--warn-bg);color:var(--warn)}
.pill.bad{background:var(--bad-bg);color:var(--bad)}
.pill.ok{background:var(--ok-bg);color:var(--ok)}
.pill.urg{background:var(--orange);color:var(--on-orange);font-weight:800;letter-spacing:.4px}
.pill.prog{background:var(--primary);color:var(--on-primary);font-weight:800;letter-spacing:.4px}
.badge{background:var(--orange);color:var(--on-orange);font-size:11px;font-weight:800;border-radius:10px;padding:1px 7px;line-height:1.5}
.muted{color:var(--muted)}
.small{font-size:13px}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;background:var(--surface-2);border-radius:12px;padding:4px;gap:4px;border:1px solid var(--line)}
.seg button{border:0;border-radius:9px;background:transparent;color:var(--fg-2);font-weight:600;font-size:15px;height:42px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--orange);color:var(--on-orange);font-weight:800}
.seg.blue button[aria-pressed="true"]{background:var(--primary);color:var(--on-primary)}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{border:1px solid var(--line-2);background:var(--surface);border-radius:20px;padding:0 14px;height:36px;font-size:14px;font-weight:600;cursor:pointer;color:var(--fg-2)}
.chip[aria-pressed="true"]{background:var(--primary);border-color:var(--primary);color:var(--on-primary)}
.chip.plate-chip{border-radius:8px;font-weight:800;letter-spacing:.5px;height:42px}

/* fila */
.qhead{display:flex;align-items:center;gap:10px;padding:12px 16px;border-bottom:1px solid var(--line)}
.dot{width:10px;height:10px;border-radius:5px;flex:none}
.qrow{display:grid;grid-template-columns:64px 100px minmax(0,1fr) 176px 104px 64px;gap:12px;align-items:center;padding:11px 16px;border:0;border-bottom:1px solid var(--line);background:none;width:100%;text-align:left;cursor:pointer;font-size:14px;color:var(--fg)}
.qrow:hover{background:var(--surface-2)}
.qrow:last-child{border-bottom:0}
.qscroll{overflow-x:auto}
.qscroll .qrow{min-width:620px}
.qrow .quem{display:block;font-size:12px;font-weight:500;color:var(--muted);margin-top:2px}
.qcard{display:flex;flex-direction:column;gap:7px;padding:14px;border:1px solid var(--line);border-radius:14px;background:var(--surface);box-shadow:var(--shadow);text-align:left;width:100%;cursor:pointer;color:var(--fg)}
.qcard .t{font-size:17px;font-weight:700;line-height:1.25}
.qcard .meta{display:flex;gap:12px;font-size:13px;color:var(--muted);flex-wrap:wrap;align-items:center}
.qlist-m{display:none;flex-direction:column;gap:10px}
@media (max-width:820px){.qdesk{display:none}.qlist-m{display:flex}}
.empty{padding:28px 16px;text-align:center;color:var(--muted)}
.tag-sug{font-size:11px;font-weight:700;color:var(--warn);border:1px dashed var(--warn);border-radius:20px;padding:1px 8px}

/* stats */
.stat{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px}
.stat .l{display:block;font-size:12px;color:var(--muted)}
.stat .v{font-size:24px;font-weight:800;font-variant-numeric:tabular-nums}
.stat.hero{background:var(--bar);color:var(--on-bar);border:0}
.stat.hero .l{color:var(--on-bar-2)}
.stat.hero .v{font-size:28px}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.bar{height:8px;border-radius:4px;background:var(--primary)}
.mstats{display:none;gap:8px;overflow-x:auto}
@media (max-width:1180px){.mstats{display:flex}.mstats .stat{flex:1 0 140px}}

/* formulários */
.field{display:flex;flex-direction:column;gap:6px}
.field>label,.field>.lbl{font-size:14px;font-weight:700;color:var(--fg-2)}
.input,select.input,textarea.input{width:100%;min-height:46px;border:1px solid var(--line-2);border-radius:10px;padding:10px 12px;background:var(--surface);font-size:16px}
textarea.input{resize:vertical;min-height:84px}
.hint{font-size:12px;color:var(--muted)}
.fgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
@media (max-width:560px){.fgrid{grid-template-columns:1fr}}
.photos{display:grid;grid-template-columns:repeat(auto-fill,minmax(76px,1fr));gap:8px}
.photo{aspect-ratio:1;max-width:100%;border-radius:10px;overflow:hidden;position:relative;background:var(--surface-2);border:0;padding:0;cursor:zoom-in}
.photo img{width:100%;height:100%;object-fit:cover;display:block}
.photo .x{position:absolute;top:4px;right:4px;width:26px;height:26px;border-radius:13px;border:0;background:rgba(0,0,0,.6);color:#fff;font-weight:800;cursor:pointer}
.addphoto{aspect-ratio:1;max-width:100%;border-radius:10px;border:2px dashed var(--line-2);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;color:var(--heading);font-size:12px;font-weight:700;cursor:pointer;background:var(--surface)}
.addphoto input{position:absolute;width:1px;height:1px;opacity:0}
.switch{display:flex;gap:12px;align-items:flex-start;padding:12px;border-radius:12px;border:1px solid var(--line-2);background:var(--surface);cursor:pointer}
.switch input{width:22px;height:22px;margin:2px 0 0;accent-color:var(--bad);flex:none}
.switch.on{border-color:var(--bad);background:var(--bad-bg)}
.emerg{border:1px solid var(--bad);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:12px}

/* detalhe */
.dhead{display:flex;flex-direction:column;gap:10px}
.dhead .top{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.dhead h1{font-family:var(--f-display);font-size:28px;font-weight:800;color:var(--heading);line-height:1.15}
.steps{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:4px}
.steps span{height:6px;border-radius:3px;background:var(--line-2)}
.steps span.done{background:var(--primary)}
.steps span.now{background:var(--orange)}
.steps-l{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:4px;font-size:11px;font-weight:600;color:var(--muted)}
.steps-l .now{color:var(--warn);font-weight:800}
.dgrid{display:flex;gap:16px;align-items:flex-start;flex-wrap:wrap}
.dgrid>.a{flex:1 1 320px;min-width:0;display:flex;flex-direction:column;gap:14px}
.dgrid>.b{flex:2 1 460px;min-width:0;display:flex;flex-direction:column;gap:14px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:14px}
.kv dt{color:var(--muted)}
.kv dd{margin:0;font-weight:600;min-width:0}
.hist{display:flex;flex-direction:column;gap:8px;font-size:13px}
.hist div{display:grid;grid-template-columns:92px 1fr;gap:8px}
.compra{border:1px solid var(--line);border-radius:14px;background:var(--surface);overflow:hidden}
.compra .ch{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:12px 16px;border-bottom:1px solid var(--line)}
.compra .ch h3{font-size:16px;font-weight:800}
.cot{display:grid;grid-template-columns:28px minmax(140px,1fr) auto;gap:4px 10px;align-items:center;padding:12px 16px;border:0;border-bottom:1px solid var(--line);background:none;width:100%;text-align:left;cursor:pointer;color:var(--fg)}
.cot:disabled{cursor:default}
.cot .radio{width:18px;height:18px;border-radius:9px;border:2px solid var(--line-2)}
.cot.sel{background:var(--sel)}
.cot.sel .radio{border:5px solid var(--primary)}
.cot .f{font-weight:700}
.cot .v{font-weight:800;text-align:right;font-variant-numeric:tabular-nums}
.cot .m{grid-column:2/4;font-size:13px;color:var(--muted)}
.notice{border-radius:12px;padding:12px;font-size:14px;display:flex;flex-direction:column;gap:4px}
.notice.warn{background:var(--warn-bg);color:var(--warn)}
.notice.ok{background:var(--ok-bg);color:var(--ok)}
.notice.bad{background:var(--bad-bg);color:var(--bad)}
.notice.info{background:var(--info-bg);color:var(--info)}
.notice b{font-weight:800}
.actions{display:flex;gap:10px;flex-wrap:wrap;padding:12px 16px;border-top:1px solid var(--line)}

/* OC */
.ocbig{background:var(--bar);color:var(--on-bar);border-radius:16px;padding:20px;display:flex;flex-direction:column;align-items:center;gap:4px;text-align:center}
.ocbig .l{font-size:12px;font-weight:700;letter-spacing:1.2px;color:var(--on-bar-2)}
.ocbig .n{white-space:nowrap;font-family:var(--f-display);font-size:clamp(34px,11vw,48px);font-weight:800;letter-spacing:1px;font-variant-numeric:tabular-nums;line-height:1.1}
.olist{display:flex;flex-direction:column}
.orow{display:grid;grid-template-columns:120px 100px minmax(160px,1fr) 120px 150px;gap:12px;align-items:center;padding:12px 16px;border:0;border-bottom:1px solid var(--line);background:none;width:100%;text-align:left;cursor:pointer;color:var(--fg);font-size:14px}
.orow:hover{background:var(--surface-2)}
@media (max-width:820px){.orow{grid-template-columns:1fr auto;gap:4px 10px}.orow .hm{display:none}}

/* modal e toast */
.modal{position:fixed;inset:0;z-index:50;background:rgba(6,15,35,.55);display:flex;align-items:flex-end;justify-content:center;padding:max(12px,env(safe-area-inset-top,0px)) max(12px,env(safe-area-inset-right,0px)) 0 max(12px,env(safe-area-inset-left,0px))}
@media (min-width:821px){.modal{align-items:center;padding:24px}}
.sheet{background:var(--surface);color:var(--fg);width:100%;max-width:560px;max-height:92vh;overflow:auto;border-radius:18px 18px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:14px}
@media (min-width:821px){.sheet{border-radius:18px;padding:22px}}
.sheet h2{font-family:var(--f-display);font-size:24px;font-weight:800;color:var(--heading)}
.sheet .foot{display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap}
.viewer img{width:100%;height:auto;border-radius:10px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(150px + env(safe-area-inset-bottom,0px));z-index:60;background:var(--fg);color:var(--bg);padding:12px 18px;border-radius:12px;font-weight:600;max-width:min(92vw,480px);box-shadow:0 8px 24px rgba(0,0,0,.25)}
@media (min-width:821px){.toast{bottom:28px}}
#modal-root:not(:empty) ~ #toast-root .toast{bottom:auto;top:calc(12px + env(safe-area-inset-top,0px));z-index:70}
.post{padding:12px 16px;display:flex;flex-direction:column;gap:8px;border-top:1px solid var(--line);background:var(--surface-2)}
.etapa{display:grid;grid-template-columns:28px minmax(0,1fr) auto;gap:4px 10px;align-items:center;padding:12px 16px;border-bottom:1px solid var(--line)}
.etapa:last-child{border-bottom:0}
.etapa .ok-i{width:24px;height:24px;border-radius:12px;display:flex;align-items:center;justify-content:center;background:var(--ok-bg);color:var(--ok)}
.etapa .pend-i{width:24px;height:24px;border-radius:12px;border:2px dashed var(--line-2)}
.etapa .bad-i{width:24px;height:24px;border-radius:12px;background:var(--bad-bg);color:var(--bad);display:flex;align-items:center;justify-content:center;font-weight:800}
.etapa .sub{grid-column:2/4;font-size:13px;color:var(--muted)}
.toast.bad{background:var(--bad);color:#fff}

/* login */
.login{min-height:100%;display:flex;align-items:center;justify-content:center;padding-block:32px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.login .box{width:100%;max-width:420px;display:flex;flex-direction:column;gap:18px}
.login .logo{background:var(--logo-bg);border-radius:10px;padding:8px;align-self:center}
.login .logo img{width:300px;max-width:100%;display:block}
.ubtn{display:flex;align-items:center;gap:12px;padding:12px 14px;border:1px solid var(--line);border-radius:12px;background:var(--surface);cursor:pointer;width:100%;text-align:left;color:var(--fg)}
.ubtn:hover{border-color:var(--primary)}
.av{width:38px;height:38px;border-radius:19px;background:var(--primary);color:var(--on-primary);font-weight:800;display:flex;align-items:center;justify-content:center;flex:none;font-size:14px}
.banner{background:var(--info-bg);color:var(--info);border-radius:12px;padding:10px 14px;font-size:13px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.tbl{width:100%;border-collapse:collapse;font-size:14px}
.tbl th{text-align:left;font-size:12px;color:var(--muted);font-weight:700;padding:10px 12px;background:var(--surface-2)}
.tbl td{padding:10px 12px;border-top:1px solid var(--line);vertical-align:middle}

/* visual do esboço */
.m-only{display:none}
.hero{background:var(--bar);color:var(--on-bar);border-radius:16px;padding:18px 22px 20px;display:flex;flex-direction:column;gap:10px}
.hero .top{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.hbtn{width:44px;height:44px;margin-left:-10px;border:0;background:none;color:var(--on-bar);display:flex;align-items:center;justify-content:center;border-radius:10px;cursor:pointer;flex:none}
.hbtn:hover{background:var(--bar-hover)}
.plate.stock{background:var(--warn-bg);color:var(--warn);border-color:var(--warn-bg)}
.plate.inv.stock{background:var(--orange);color:var(--on-orange);border-color:var(--orange)}
.plate.inv{background:var(--plate-inv-bg);color:var(--plate-inv-fg);border-color:var(--plate-inv-bg);font-size:15px}
.hnum{color:var(--on-bar-2);font-size:14px}

<body>
<div id="app"></div>
<div id="modal-root"></div>
<div id="toast-root"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="config.js"></script>

<script>
'use strict';
/* =========================================================
   BARRETO MANUTENÇÃO
   OS = demanda de manutenção de uma placa (etapas: aberta → triagem →
   realização → aguardando fechamento → fechada).
   OC = compra de insumo ou serviço, dentro de uma OS ou para o estoque.
   O app lê as tabelas do Supabase e grava só pelas funções do banco,
   onde ficam as regras de alçada, cotação e numeração.
   ========================================================= */

const PERFIS = { motorista:'Motorista', mecanico:'Mecânico', analista:'Analista operacional', financeiro:'Financeiro', gestor:'Gestor' };
const LS_TAB = 'barreto-manutencao-tab';
const CFG = window.BARRETO_CONFIG || {};
let sb = null;
const VAPID = CFG.vapidPublicKey || '';
let pushAtivo = false;
const pushSuportado = () => !!VAPID && 'serviceWorker' in navigator && 'PushManager' in window && 'Notification' in window;
function b64ToU8(s){ const p = '='.repeat((4 - s.length % 4) % 4); const b = atob((s + p).replace(/-/g, '+').replace(/_/g, '/')); return Uint8Array.from([...b].map(c => c.charCodeAt(0))); }
async function checarPush(){
  pushAtivo = false;
  if (!pushSuportado() || Notification.permission !== 'granted') return;
  try { const reg = await navigator.serviceWorker.getRegistration(); const sub = reg && await reg.pushManager.getSubscription(); pushAtivo = !!sub; } catch (e) {}
}
async function ativarPush(){
  if (!pushSuportado()) throw new Error('Este navegador não recebe avisos. No iPhone, instale o app na tela inicial primeiro.');
  const perm = await Notification.requestPermission();
  if (perm !== 'granted') throw new Error('Os avisos foram bloqueados. Libere as notificações deste site nas configurações do navegador.');
  const reg = await navigator.serviceWorker.register('sw.js'); await navigator.serviceWorker.ready;
  let sub = await reg.pushManager.getSubscription();
  if (!sub) sub = await reg.pushManager.subscribe({ userVisibleOnly: true, applicationServerKey: b64ToU8(VAPID) });
  await rpc('salvar_push', { p: sub.toJSON() });
  pushAtivo = true;
}
async function desativarPush(){
  try { const reg = await navigator.serviceWorker.getRegistration(); const sub = reg && await reg.pushManager.getSubscription();
    if (sub) { await rpc('remover_push', { p_endpoint: sub.endpoint }).catch(() => {}); await sub.unsubscribe(); } } catch (e) {}
  pushAtivo = false;
}
function pushCard(){
  if (!VAPID || !ME || ME.perfil === 'financeiro') return '';
  const oque = ['gestor', 'analista'].includes(ME.perfil) ? 'quando uma compra precisar de aprovação' : 'quando o seu pedido de compra for aprovado ou reprovado';
  if (pushAtivo) return `<div class="banner">${ic('check', 18)}<span>Avisos ativados neste aparelho.</span><button class="btn sm" data-act="push-off" style="margin-left:auto">Desativar</button></div>`;
  const ios = /iPhone|iPad|iPod/.test(navigator.userAgent) && !window.navigator.standalone;
  if (ios || !pushSuportado()) return `<div class="banner">${ic('info', 18)}<span>Para receber avisos no iPhone, instale o app na tela inicial (Compartilhar › Adicionar à Tela de Início) e abra por lá.</span></div>`;
  return `<div class="banner">${ic('info', 18)}<span>Receba um aviso no celular ${oque}.</span><button class="btn sm primary" data-act="push-on" style="margin-left:auto">Ativar avisos</button></div>`;
}

const ICON = {
  fila:'<path d="M4 6h16M4 12h16M4 18h10"/>',
  check:'<path d="M5 12l4 4 10-10"/>',
  doc:'<rect x="5" y="3" width="14" height="18" rx="2"/><path d="M9 8h6M9 12h6M9 16h4"/>',
  more:'<circle cx="5" cy="12" r="1.5"/><circle cx="12" cy="12" r="1.5"/><circle cx="19" cy="12" r="1.5"/>',
  plus:'<path d="M12 5v14M5 12h14"/>',
  cam:'<rect x="3" y="6" width="18" height="14" rx="2"/><circle cx="12" cy="13" r="3.5"/><path d="M8 6l1.5-2h5L16 6"/>',
  back:'<path d="M15 5l-7 7 7 7"/>',
  truck:'<path d="M3 7h11v9H3zM14 10h4l3 3v3h-7z"/><circle cx="7" cy="17.5" r="1.8"/><circle cx="17" cy="17.5" r="1.8"/>',
  store:'<path d="M4 9l1.5-5h13L20 9M4 9h16v11H4zM9 20v-6h6v6"/>',
  box:'<path d="M3 7l9-4 9 4v10l-9 4-9-4z"/><path d="M3 7l9 4 9-4M12 11v10"/>',
  gear:'<circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M4.9 19.1L7 17M17 7l2.1-2.1"/>',
  out:'<path d="M15 4h4v16h-4M10 8l-4 4 4 4M6 12h10"/>',
  copy:'<rect x="8" y="8" width="12" height="12" rx="2"/><path d="M16 8V5a1 1 0 00-1-1H5a1 1 0 00-1 1v10a1 1 0 001 1h3"/>',
  info:'<circle cx="12" cy="12" r="9"/><path d="M12 8v5M12 16v.5"/>',
  x:'<path d="M6 6l12 12M18 6L6 18"/>'
};
const ic = (n, s=22, w=2) => `<svg aria-hidden="true" width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="${w}" stroke-linecap="round" stroke-linejoin="round">${ICON[n]}</svg>`;

/* ---------- utilidades ---------- */
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const fmtR = v => (v == null || v === '' || isNaN(v)) ? '—' : Number(v).toLocaleString('pt-BR', { style:'currency', currency:'BRL' });
const parseR = s => { s = String(s ?? '').replace(/[^\d,.-]/g, ''); if (s.includes(',')) s = s.replace(/\./g, '').replace(',', '.'); const n = parseFloat(s); return isNaN(n) ? null : n; };
const fmtDT = iso => iso ? new Date(iso).toLocaleString('pt-BR', { day:'2-digit', month:'2-digit', hour:'2-digit', minute:'2-digit' }) : '—';
const fmtD = iso => iso ? new Date(iso).toLocaleDateString('pt-BR') : '—';
const fmtKm = v => v == null ? '—' : Number(v).toLocaleString('pt-BR') + ' km';
function rel(iso){
  if (!iso) return '';
  const m = Math.round((Date.now() - new Date(iso)) / 60000);
  if (m < 1) return 'agora';
  if (m < 60) return `há ${m} min`;
  const h = Math.round(m / 60);
  if (h < 24) return `há ${h} h`;
  const d = Math.round(h / 24);
  return d === 1 ? 'ontem' : `há ${d} dias`;
}
const dias = iso => iso ? Math.floor((Date.now() - new Date(iso)) / 864e5) : 0;
const initials = n => String(n || '?').split(/\s+/).filter(Boolean).slice(0, 2).map(p => p[0]).join('').toUpperCase();
const TEL_DOM = 'tel.barretomanutencao.app';
function normTel(v){ let d = String(v || '').replace(/\D/g, ''); if (d.startsWith('55') && (d.length === 12 || d.length === 13)) d = d.slice(2); return (d.length === 10 || d.length === 11) ? d : null; }
const fmtTel = d => { d = String(d || '').replace(/\D/g, ''); if (d.startsWith('55') && d.length > 11) d = d.slice(2); return !d ? '' : d.length === 11 ? `(${d.slice(0, 2)}) ${d.slice(2, 7)}-${d.slice(7)}` : d.length === 10 ? `(${d.slice(0, 2)}) ${d.slice(2, 6)}-${d.slice(6)}` : d; };
const DESTINOS = { tracao:'Tração', carreta:'Carreta', estoque:'Estoque' };
const TIPOS = { peca:'Insumo/peça', servico:'Serviço de terceiro', ambos:'Peça + serviço' };
const ehEstoque = x => x && x.destino === 'estoque';
const alvoTxt = x => ehEstoque(x) ? 'Estoque' : (x?.placa || '—');
const plateHtml = (x, cls = 'plate') => ehEstoque(x) ? `<span class="${cls} stock">ESTOQUE</span>` : `<span class="${cls}">${esc(x?.placa || '—')}</span>`;
const tipoPlaca = pl => S.veiculos.find(v => v.placa === pl)?.tipo || 'tracao';
const normPlaca = p => String(p || '').toUpperCase().replace(/[^A-Z0-9]/g, '');

/* ---------- estado ---------- */
let S = { config:{ alcada:{ motorista:200, mecanico:400, analista:1000 }, cotMin:200, cotQtd:3 }, users:[], veiculos:[], fornecedores:[], os:[], compras:[], ordens:[] };
const lsGet = k => { try { return localStorage.getItem(k); } catch (e) { return null; } };
const lsSet = (k, v) => { try { v == null ? localStorage.removeItem(k) : localStorage.setItem(k, v); } catch (e) {} };

/* ---------- consultas ---------- */
const user = id => S.users.find(u => u.id === id);
const forn = id => S.fornecedores.find(f => f.id === id);
const osById = id => S.os.find(m => m.id === id);
const compra = id => S.compras.find(c => c.id === id);
const ordem = id => S.ordens.find(o => o.id === id);
const nomeU = id => user(id)?.nome || '—';
const nomeF = id => forn(id)?.nome || '—';
const comprasDe = m => S.compras.filter(c => c.osId === m.id);
const alcada = u => u.perfil === 'gestor' ? Infinity : u.perfil === 'financeiro' ? 0 : (u.alcada != null && u.alcada !== '' ? Number(u.alcada) : (S.config.alcada[u.perfil] || 0));
const cotNecessarias = v => v < S.config.cotMin ? 1 : S.config.cotQtd;
const escolhida = c => c.cotacoes.find(q => q.id === c.escolhidaId);
const valorCompra = c => { const o = ordem(c.ocId); return o ? o.valor : (escolhida(c)?.valor ?? null); };
const menorCot = c => c.cotacoes.reduce((a, q) => (!a || q.valor < a.valor) ? q : a, null);
const compraDeOC = o => compra(o.compraId);
const precisaPosterior = o => o.semCotacao && o.valor >= S.config.cotMin;
function ocPend(o){
  const np = compraDeOC(o)?.posteriores.length || 0;
  return { entrega: !o.entregueEm, post: precisaPosterior(o) && np < 1, np };
}
function difPosterior(o){
  const ps = compraDeOC(o)?.posteriores || [];
  return (!o.semCotacao || !ps.length) ? null : o.valor - Math.min(...ps.map(p => p.valor));
}

const ETAPAS = ['aberta', 'triagem', 'realizacao', 'aguardando_fechamento', 'fechada'];
const ETAPA = {
  aberta:['Aguardando triagem', 'warn'], triagem:['Em triagem', 'info'], realizacao:['Em realização', 'ok'],
  aguardando_fechamento:['Aguardando fechamento', 'info'], fechada:['Fechada', 'neutral'], cancelada:['Cancelada', 'neutral']
};
const osAtiva = m => ['aberta', 'triagem', 'realizacao'].includes(m.etapa);
const osEncerrada = m => ['fechada', 'cancelada'].includes(m.etapa);
const pillEtapa = m => `<span class="pill ${ETAPA[m.etapa][1]}">${ETAPA[m.etapa][0]}</span>`;
const pillPri = m => m.prioridade === 'urgente' ? '<span class="pill urg">URGENTE</span>' : '<span class="pill prog">PROGRAMADA</span>';
const temAprovacao = m => comprasDe(m).some(c => c.status === 'aprovacao');
function pillOS(m){
  if (osAtiva(m) && temAprovacao(m)) return '<span class="pill warn">Compra aguardando aprovação</span>';
  return pillEtapa(m);
}

const P = (...ps) => ME && ps.includes(ME.perfil);
const pode = {
  prioridade: () => P('gestor'),
  triagem: () => P('gestor'),
  concluirServico: () => P('mecanico', 'analista', 'gestor'),
  fecharOS: () => P('analista', 'gestor'),
  cancelarOS: () => P('analista', 'gestor'),
  atender: () => P('mecanico', 'analista', 'gestor'),
  abrirOC: () => P('mecanico', 'analista', 'gestor'),
  pedirSemCotacao: () => !P('financeiro'),
  cotar: c => c.osId ? P('mecanico', 'analista', 'gestor') : P('analista', 'gestor'),
  aprovarPerfil: () => P('mecanico', 'analista', 'gestor'),
  aprovar: c => pode.aprovarPerfil() && (c.osId || P('analista', 'gestor')) && (valorCompra(c) ?? Infinity) <= alcada(ME),
  cancelarCompra: c => P('analista', 'gestor') || (c.criadoPor === ME.id && ['cotacao', 'reprovada'].includes(c.status)),
  cancelarOC: () => P('gestor'),
  posterior: () => P('mecanico', 'analista', 'gestor'),
  cadastros: () => P('analista', 'gestor'),
  completarForn: () => P('analista', 'gestor'),
  config: () => P('gestor'),
  exportar: () => !P('motorista')
};
function visiveis(){
  if (ME.perfil !== 'motorista') return S.os;
  return S.os.filter(m => m.abertoPor === ME.id || (ME.placa && m.placa === ME.placa));
}
function pendentesAprovacao(){
  if (!pode.aprovarPerfil()) return [];
  return S.compras.filter(c => c.status === 'aprovacao' && pode.aprovar(c));
}
const fornProvisorios = () => S.fornecedores.filter(f => f.provisorio);

/* ---------- Supabase ---------- */
const fotoURL = {};
const histCache = {};
const num = v => v == null ? null : Number(v);
async function rpc(fn, args){
  const { data, error } = await sb.rpc(fn, args);
  if (error) throw new Error(error.message);
  return data;
}
async function run(fn, args){ const r = await rpc(fn, args); await reload(); return r; }
async function assinar(paths){
  const falta = [...new Set(paths.filter(p => p && !fotoURL[p]))];
  if (!falta.length) return;
  const { data } = await sb.storage.from('fotos').createSignedUrls(falta, 60 * 60 * 12);
  (data || []).forEach(d => { if (d.signedUrl) fotoURL[d.path] = d.signedUrl; });
}
const furl = p => p ? (fotoURL[p] || '') : null;
async function uploadFoto(dataUrl, pasta){
  const blob = await (await fetch(dataUrl)).blob();
  const path = `${pasta}/${new Date().toISOString().slice(0, 7)}/${uid()}.jpg`;
  const { error } = await sb.storage.from('fotos').upload(path, blob, { contentType: 'image/jpeg', upsert: false });
  if (error) throw new Error('Não consegui enviar a foto: ' + error.message);
  fotoURL[path] = dataUrl;
  return path;
}
async function reload(){
  const q = async (b) => { const { data, error } = await b; if (error) throw new Error(error.message); return data; };
  const [p, cfg, vs, fs, ms, cs, qs, os] = await Promise.all([
    q(sb.from('profiles').select('*').order('nome')),
    q(sb.from('config').select('*').eq('id', 1).single()),
    q(sb.from('veiculos').select('*').eq('ativo', true).order('placa')),
    q(sb.from('fornecedores').select('*').order('nome')),
    q(sb.from('manutencoes').select('*').order('aberto_em', { ascending: false }).limit(2000)),
    q(sb.from('compras').select('*').order('criado_em').limit(5000)),
    q(sb.from('cotacoes').select('*').order('em').limit(10000)),
    q(sb.from('ordens').select('*').order('aprovado_em', { ascending: false }).limit(5000))
  ]);
  await assinar([...ms.flatMap(m => m.fotos || []), ...qs.map(x => x.anexo), ...os.map(o => o.entrega_foto)]);
  const cotPor = {}, posPor = {};
  qs.forEach(x => ((x.posterior ? posPor : cotPor)[x.compra_id] ||= []).push({ id: x.id, fornecedorId: x.fornecedor_id, valor: num(x.valor), prazo: x.prazo, pagamento: x.pagamento, obs: x.obs, anexo: furl(x.anexo), por: x.por, em: x.em }));
  S = {
    config: { alcada: { motorista: num(cfg.alcada_motorista), mecanico: num(cfg.alcada_mecanico), analista: num(cfg.alcada_analista) },
      cotMin: num(cfg.cot_min_valor ?? 200), cotQtd: cfg.cot_qtd ?? 3 },
    users: p.map(u => ({ id: u.id, nome: u.nome || u.email, email: (u.email || '').endsWith(TEL_DOM) ? '' : u.email, telefone: u.telefone || '', perfil: u.perfil, placa: u.placa, ativo: u.ativo, alcada: u.alcada == null ? null : Number(u.alcada) })),
    veiculos: vs.map(v => ({ id: v.id, placa: v.placa, tipo: v.tipo, marca: v.marca, anoModelo: v.ano_modelo })),
    fornecedores: fs.map(f => ({ id: f.id, nome: f.nome, cnpj: f.cnpj, cidade: f.cidade, telefone: f.telefone, whatsapp: f.whatsapp || '', categoria: f.categoria, provisorio: f.provisorio })),

function compressImage(file, max = 1280, q = 0.68){
  return new Promise((res, rej) => {
    const rd = new FileReader();
    rd.onerror = rej;
    rd.onload = () => {
      const img = new Image();
      img.onerror = rej;
      img.onload = () => {
        const k = Math.min(1, max / Math.max(img.width, img.height));
        const cv = document.createElement('canvas');
        cv.width = Math.round(img.width * k); cv.height = Math.round(img.height * k);
        cv.getContext('2d').drawImage(img, 0, 0, cv.width, cv.height);
        res(cv.toDataURL('image/jpeg', q));
      };
      img.src = rd.result;
    };
    rd.readAsDataURL(file);
  });
}

function totais(){
  const d = new Date(), ini = new Date(d.getFullYear(), d.getMonth(), 1);
  const vivas = S.ordens.filter(o => o.status !== 'cancelada');
  const mes = vivas.filter(o => new Date(o.aprovadoEm) >= ini);
  const gasto = mes.reduce((a, o) => a + o.valor, 0);
  const porPlaca = {};
  mes.forEach(o => { const k = alvoTxt(o); porPlaca[k] = (porPlaca[k] || 0) + o.valor; });
  const placas = Object.entries(porPlaca).sort((a, b) => b[1] - a[1]).slice(0, 6);
  const tc = [], ts = [];
  mes.forEach(o => { const c = compraDeOC(o); if (c?.solicitadaEm) (o.semCotacao ? ts : tc).push((new Date(o.aprovadoEm) - new Date(c.solicitadaEm)) / 3600e3); });
  const media = a => a.length ? a.reduce((x, y) => x + y, 0) / a.length : null;
  const fech = S.os.filter(m => m.etapa === 'aguardando_fechamento');
  const difs = mes.map(difPosterior).filter(x => x != null);
  return { gasto, nOC: mes.length, nPlacas: Object.keys(porPlaca).filter(k => k !== 'Estoque').length, temEstoque: 'Estoque' in porPlaca, placas,
    aguard: S.compras.filter(c => c.status === 'aprovacao').length,
    entrega: vivas.filter(o => !o.entregueEm).length,
    fech: fech.length, fechDias: fech.length ? Math.max(...fech.map(m => dias(m.concluidaEm))) : 0,
    postPend: vivas.filter(o => ocPend(o).post).length,
    pctSem: mes.length ? Math.round(100 * mes.filter(o => o.semCotacao).length / mes.length) : 0,
    dif: difs.length ? difs.reduce((a, b) => a + b, 0) : null,
    tmCot: media(tc), tmSem: media(ts), mesNome: d.toLocaleDateString('pt-BR', { month:'long' }) };
}

/* ---------- fila de OS ---------- */
const FILTROS_OS = [
  ['', 'Todas'], ['minhas', 'Minhas'], ['triagem', 'Aguardando triagem'], ['realizacao', 'Em realização'],
  ['aprovacao', 'Compra aguardando aprovação'], ['fechamento', 'Aguardando fechamento'], ['encerradas', 'Fechadas']
];
function filtroOS(m){
  switch (V.so) {
    case 'minhas': return m.abertoPor === ME.id || m.atendidoPor === ME.id;
    case 'triagem': return m.etapa === 'aberta' || m.etapa === 'triagem';
    case 'realizacao': return m.etapa === 'realizacao';
    case 'aprovacao': return temAprovacao(m);
    default: return true;
  }
}
function valorOS(m){ return comprasDe(m).filter(c => c.status !== 'cancelada' && ordem(c.ocId)?.status !== 'cancelada').reduce((a, c) => a + (valorCompra(c) || 0), 0); }

      <span>${pillOS(m)}</span>
      <span class="num" style="font-weight:700;text-align:right">${nv ? fmtR(nv) : '—'}</span><span class="muted" style="text-align:right">${rel(m.etapa === 'aguardando_fechamento' ? m.concluidaEm : m.abertoEm)}</span></button>`; };
  const card = m => `<button class="qcard" data-go="os" data-id="${m.id}">
      <span class="row" style="justify-content:space-between">${plateHtml(m)}${pillOS(m)}</span>

      <span class="meta"><span class="num">${esc(m.num)}</span><span>${esc(nomeU(m.abertoPor))}</span>${m.fotos.length ? `<span class="row" style="gap:4px">${ic('cam', 15)}${m.fotos.length}</span>` : ''}${!m.prioridadeConfirmada && osAtiva(m) ? '<span class="tag-sug">prioridade sugerida</span>' : ''}<span style="margin-left:auto">${rel(m.etapa === 'aguardando_fechamento' ? m.concluidaEm : m.abertoEm)}</span></span></button>`;
  const section = (titulo, cor, arr, vazio = 'Nada por aqui.') => `

    ${pode.fecharOS() && fechamento.length && V.so !== 'fechamento' ? `<div class="banner">${ic('info', 18)}<span><b>${fechamento.length} OS aguardando fechamento.</b> Confirme com os envolvidos se o problema foi resolvido.</span><button class="btn sm primary" data-act="so" data-v="fechamento" style="margin-left:auto">Ver</button></div>` : ''}

    <div class="with-panel"><div class="col">

      <div class="row hide-m" style="gap:8px">

        </select>

        <select class="chip m-only" id="placa-fila-m" aria-label="Placa"><option value="">Todas as placas</option>${placas.map(p => `<option ${V.placa === p ? 'selected' : ''}>${esc(p)}</option>`).join('')}</select>

}

async function submitNova(){
  const d = draft;
  if (!d.placa) return toast('Escolha a placa.', true);
  if (!d.descricao.trim()) return toast('Descreva o que está acontecendo.', true);
  const kmTxt = String(d.km || '').replace(/\D/g, '');
  const m = await api.abrirOS({ destino: d.destino, placa: d.placa, descricao: d.descricao.trim(), prioridade: d.prioridade, fotos: d.fotos, km: kmTxt ? Number(kmTxt) : null });
  draft = null;
  toast(`${m.num} aberta.`);
  go('os', m.id, { replace: true });

/* ---------- detalhe da OS ---------- */
let barHtml = '', barPri = 0;
function proximoPasso(m){
  const btn = (act, txt, cls = 'primary') => `<button class="btn ${cls}" data-act="${act}">${txt}</button>`;
  const cs = comprasDe(m);
  const pend = cs.filter(c => ['cotacao', 'reprovada', 'aprovacao'].includes(c.status)).length;
  const semEntrega = cs.filter(c => { const o = ordem(c.ocId); return o && o.status !== 'cancelada' && !o.entregueEm; }).length;
  switch (m.etapa) {
    case 'aberta': return { cls:'warn', t:'Aguardando triagem do gestor', s:'O gestor define o que será feito e o que é preciso: estoque, compra ou serviço de terceiro.',
      b: pode.triagem() ? btn('iniciar-triagem', 'Iniciar triagem', '') + btn('triagem', 'Concluir triagem') : '' };
    case 'triagem': return { cls:'info', t:`Em triagem${m.triagemPor ? ' com ' + esc(nomeU(m.triagemPor)) : ''}`, s:'Abra as OCs do que precisa ser comprado. Ao concluir, a OS segue para realização.',
      b: pode.triagem() ? btn('triagem', 'Concluir triagem') : '' };
    case 'realizacao': return { cls:'ok', t:'Em realização', s: pend || semEntrega ? `${pend ? pend + ' OC em cotação/aprovação. ' : ''}${semEntrega ? semEntrega + ' OC aguardando entrega.' : ''}` : 'Quando o serviço terminar, o mecânico dá o ok.',
      b: pode.concluirServico() ? btn('concluir-servico', 'Serviço concluído') : '' };
    case 'aguardando_fechamento': return { cls:'info', t:`Aguardando fechamento${m.concluidaEm ? (dias(m.concluidaEm) < 1 ? ' desde hoje' : ' há ' + dias(m.concluidaEm) + ' dia(s)') : ''}`,
      s:`${esc(nomeU(m.concluidaPor))} deu o ok do serviço. Confirme com os envolvidos se o problema foi resolvido.${pend || semEntrega ? ` <b>Antes de fechar: ${pend ? pend + ' OC pendente(s)' : ''}${pend && semEntrega ? ' e ' : ''}${semEntrega ? semEntrega + ' OC sem entrega' : ''}.</b>` : ''}`,
      b: pode.fecharOS() ? btn('devolver-os', 'Não resolvido: devolver', 'danger') + btn('fechar-os', 'Fechar OS') : '' };
    case 'fechada': return { cls:'ok', t:`Fechada${m.fechadaEm ? ' em ' + fmtD(m.fechadaEm) : ''}`, s: m.fechadaPor ? `Fechada por ${esc(nomeU(m.fechadaPor))}.` : '', b:'' };
    default: return { cls:'bad', t:'Cancelada', s:'', b:'' };
  }
}
function viewOS(){
  const m = osById(V.id);
  if (!m) return `<div class="content"><div class="card empty">OS não encontrada. <button class="btn sm" data-go="fila">Voltar</button></div></div>`;

  const lbls = ['Aberta', 'Triagem', 'Realização', 'Fechamento', 'Fechada'];
  const steps = lbls.map((_, i) => `<span class="${i < ei || ei === 4 ? 'done' : i === ei ? 'now' : ''}"></span>`).join('');
  const stepl = lbls.map((l, i) => `<span class="${i === ei && ei < 4 ? 'now' : ''}">${l}</span>`).join('');
  const ativa = osAtiva(m);
  const cs = comprasDe(m).filter(c => c.status !== 'cancelada');
  const canc = comprasDe(m).filter(c => c.status === 'cancelada');
  const pp = proximoPasso(m);
  // a barra fixa do celular mostra a ação mais importante: cotar/aprovar vem antes de confirmar entrega
  const blocos = cs.map(c => { barHtml = ''; barPri = 0; const h = compraHtml(c); return { h, bar: barHtml, pri: barPri }; });

  return `<div class="content">
    <section class="hero">
      <div class="top">
        <button class="hbtn" data-go="fila" aria-label="Voltar">${ic('back', 22, 2.2)}</button>

        <span class="hmeta">Aberta por ${esc(nomeU(m.abertoPor))} · ${rel(m.abertoEm)}${m.km != null ? ' · ' + fmtKm(m.km) : ''}</span>
        <span class="hst">${pillEtapa(m)}</span>
      </div>
    </section>
    ${m.etapa !== 'cancelada' ? `<div class="stack" style="gap:6px;max-width:620px"><div class="steps">${steps}</div><div class="steps-l">${stepl}</div></div>` : ''}
    <div class="notice ${pp.cls}"><b>${pp.t}</b>${pp.s ? `<span>${pp.s}</span>` : ''}${pp.b ? `<div class="row ${bar === pp.b ? 'hide-m' : ''}" style="margin-top:6px">${pp.b}</div>` : ''}</div>
    ${pode.prioridade() && !osEncerrada(m) && m.etapa !== 'aberta' && m.etapa !== 'triagem' ? `<div class="row">
      ${!m.prioridadeConfirmada ? `<button class="btn sm primary" data-act="pri" data-v="${m.prioridade}">Confirmar como ${m.prioridade}</button>` : ''}
      <button class="btn sm" data-act="pri" data-v="${m.prioridade === 'urgente' ? 'programada' : 'urgente'}">Mudar para ${m.prioridade === 'urgente' ? 'programada' : 'urgente'}</button></div>` : ''}
    <div class="dgrid">
      <div class="b">
        <div class="row" style="justify-content:space-between"><h2 style="font-size:18px;font-weight:800;color:var(--heading)">Ordens de compra desta OS</h2></div>
        ${cs.length ? comprasHtml : `<div class="card pad stack"><p class="muted" style="margin:0">${ativa
          ? `Nenhuma OC ainda. ${pode.abrirOC() ? 'Abra uma OC para cotar o que precisa ser comprado.' : 'O mecânico ou o analista abre a OC e cota.'} Se não dá para cotar (ex.: caminhão parado), peça autorização para comprar sem cotação.`
          : 'Nenhuma OC nesta OS.'}</p></div>`}
        ${botoesOC ? `<div class="row ${!cs.length ? 'hide-m' : ''}">${botoesOC}</div>` : ''}

      </div>
      <div class="a">
        <div class="card pad stack">
          <h2>OS</h2>

          <h2>Histórico</h2>
          <div class="hist">${m.historico.slice().reverse().map(h => `<div><span class="muted num">${fmtDT(h.em)}</span><span><b>${esc(nomeU(h.por))}</b> · ${esc(h.txt)}</span></div>`).join('')}</div>
        </div>
      </div>
    </div>
  </div>
  ${bar ? `<div class="actbar">${bar}</div>` : ''}`;

/* ---------- OC (compra) dentro da OS ou do estoque ---------- */
function compraHtml(c){
  const q = escolhida(c), v = q?.valor ?? null, menor = menorCot(c);
  const nec = v != null ? cotNecessarias(v) : 1;
  const falta = Math.max(0, nec - c.cotacoes.length);
  const editavel = ['cotacao', 'reprovada'].includes(c.status) && !c.semCotacao && pode.cotar(c);
  const al = alcada(ME);
  const o = ordem(c.ocId);
  const stPill = { cotacao:'<span class="pill info">Em cotação</span>', reprovada:'<span class="pill bad">Reprovada · revisar</span>',
    aprovacao: c.semCotacao ? '<span class="pill warn">Sem cotação · aguardando autorização</span>' : '<span class="pill warn">Aguardando aprovação</span>',
    aprovada: o?.status === 'cancelada' ? `<span class="pill neutral">${esc(o.num)} · cancelada</span>` : `<span class="pill ok">${esc(o?.num || 'Aprovada')}</span>`,
    cancelada:'<span class="pill neutral">Cancelada</span>' }[c.status] || '';

function posteriorHtml(c, o){

function quemAprova(v, c){
  const a = S.config.alcada;
  if (c && !c.osId) return v <= a.analista ? 'Analista ou gestor' : 'Gestor';

/* ---------- ordens de compra ---------- */
function stOCtxt(o){
  if (o.status === 'cancelada') return ['Cancelada', 'neutral'];
  if (o.fechadaEm) return ['Fechada', 'ok'];
  const p = ocPend(o);
  if (p.entrega) return ['Aguardando entrega', 'info'];
  if (p.post) return ['Falta cotação posterior', 'warn'];
  return ['Entregue', 'ok'];
}
const stOC = o => { const [t, k] = stOCtxt(o); return `<span class="pill ${k}">${t}</span>`; };
function visOrdens(){ if (ME.perfil !== 'motorista') return S.ordens; const ids = new Set(visiveis().map(m => m.id)); return S.ordens.filter(o => ids.has(o.osId)); }

  const abertas = S.compras.filter(c => ['cotacao', 'reprovada', 'aprovacao'].includes(c.status));
  if (ME.perfil !== 'motorista') return abertas;
  const ids = new Set(visiveis().map(m => m.id)); return abertas.filter(c => ids.has(c.osId));
}

   EVENTOS
   ========================================================= */
let busy = false;
function setBusy(b){ busy = b; document.body.style.cursor = b ? 'progress' : ''; }
document.addEventListener('click', async e => {
  if (busy) { e.preventDefault(); return; }
  const g = e.target.closest('[data-go]');
  if (g) { e.preventDefault(); if (g.closest('#modal-root')) closeModal(); if (g.dataset.go === 'nova' && V.view !== 'nova') draft = null; go(g.dataset.go, g.dataset.id || null); return; }
  const a = e.target.closest('[data-act]');
  if (!a) return;
  const act = a.dataset.act;
  if (act === 'modal-bg') { if (e.target === a) closeModal(); return; }
  e.preventDefault();
  const m = V.view === 'os' ? osById(V.id) : null;
  const c = compra(a.dataset.c);
  const o = ordem(a.dataset.o);
  setBusy(true);
  try {
  switch (act) {
    case 'sair': await sb.auth.signOut(); ME = null; render(); break;
    case 'esqueci': {
      const em = val('lg-email').trim();
      if (em.includes('@')) {
        const { error } = await sb.auth.resetPasswordForEmail(em, { redirectTo: location.href.split('#')[0] });
        if (error) throw new Error(error.message);
        toast('Enviamos um link para criar nova senha no seu e-mail.'); break;
      }
      openModal(`<h2>Esqueci minha senha</h2><p style="margin:0">Peça ao gestor para redefinir a sua senha. Ele faz isso pelo app, em Cadastros › Usuários, e passa uma senha provisória para você.</p><div class="foot"><button class="btn primary" data-act="fechar">Entendi</button></div>`);
      break; }
    case 'trocar-senha': modalSenha(); break;
    case 'fechar': closeModal(); break;
    case 'tab': V.tab = a.dataset.v; if (['fechamento', 'encerradas'].includes(V.so)) V.so = ''; lsSet(LS_TAB, V.tab); render(); break;
    case 'so': V.so = V.so === a.dataset.v ? '' : a.dataset.v; render(); break;
    case 'cad-tab': V.cad = a.dataset.v; render(); break;
    case 'ver-provisorios': V.cad = 'fornecedores'; go('cadastros'); break;
    /* nova OS */
    case 'mv-tipo': document.getElementById('mv-tipo').value = a.dataset.v; document.querySelectorAll('[data-act=mv-tipo]').forEach(b => b.setAttribute('aria-pressed', b.dataset.v === a.dataset.v)); break;
    case 'tr-pri': document.getElementById('tr-pri').value = a.dataset.v; document.querySelectorAll('[data-act=tr-pri]').forEach(b => b.setAttribute('aria-pressed', b.dataset.v === a.dataset.v)); break;
    case 'd-placa': draft.placa = a.dataset.v; render(); break;
    case 'd-dest': if (draft.destino !== a.dataset.v) { draft.destino = a.dataset.v; draft.placa = (ME.placa && tipoPlaca(ME.placa) === a.dataset.v) ? ME.placa : ''; } render(); break;
    case 'd-pri': draft.prioridade = a.dataset.v; render(); break;
    case 'rm-foto': draft.fotos.splice(+a.dataset.i, 1); render(); break;
    case 'ver-foto': {
      const [k, i] = a.dataset.src.split(/:(?=[^:]*$)/); let src;
      if (k === 'draft') src = draft.fotos[+i];
      else if (k === 'en-prev') src = entregaFoto;
      else if (k.startsWith('m:')) src = osById(k.slice(2))?.fotos[+i];
      else if (k.startsWith('en:')) src = ordem(k.slice(3))?.entregaFoto;
      if (src) { if (document.querySelector('#modal-root .modal')) window.open(src, '_blank'); else openModal(`<div class="viewer"><img src="${src}" alt="Foto"></div><div class="foot"><button class="btn" data-act="fechar">Fechar</button></div>`); }
      break; }
    case 'ver-anexo': { const q = c?.cotacoes.find(x => x.id === a.dataset.q); if (q?.anexo) openModal(`<div class="viewer"><img src="${q.anexo}" alt="Anexo da cotação"></div><div class="foot"><button class="btn" data-act="fechar">Fechar</button></div>`); break; }
    case 'forn-rapido': { const snap = snapForm(), r = reabrir;
      fornVolta = id => { const p = { ...snap }; if (id && r) { p[r.campo] = id; if (r.wa && !p[r.wa]) p[r.wa] = fmtTel(forn(id)?.whatsapp || ''); } r ? r.fn(p) : closeModal(); };
      modalFornecedor(null, true); break; }
    case 'forn-voltar': { const v = fornVolta; fornVolta = null; if (v) v(''); else closeModal(); break; }
    /* OS */
    case 'pri': await api.definirPrioridade(m, a.dataset.v); render(); toast(`Definida como ${a.dataset.v}.`); break;
    case 'atender': await api.atender(m); render(); toast('Atendimento assumido.'); break;
    case 'comentar': modalJustificar({ titulo:'Comentar', label:'Comentário', obrig:true, botao:'Salvar', onOk: async t => { await api.comentar(m, t); closeModal(); render(); } }); break;
    case 'cancelar-os': modalJustificar({ titulo:'Cancelar OS', texto:'A OS sai da fila e as OCs ainda sem número são canceladas. OCs já aprovadas continuam valendo (só o gestor cancela, na tela da OC).', label:'Motivo', obrig:true, botao:'Cancelar OS', onOk: async t => { await api.cancelarOS(m, t); closeModal(); go('fila'); toast('OS cancelada.'); } }); break;
    case 'iniciar-triagem': await api.iniciarTriagem(m); render(); toast('Triagem iniciada.'); break;
    case 'triagem': modalTriagem(m); break;
    case 'concluir-servico': await api.concluirServico(m); render(); toast('Ok dado. A OS foi para a fila de fechamento do analista.'); break;
    case 'devolver-os': modalJustificar({ titulo:'Devolver para realização', texto:'A OS volta para a fila como em realização.', label:'O que não foi resolvido?', obrig:true, botao:'Devolver', onOk: async t => { await api.devolverOS(m, t); closeModal(); render(); toast('OS devolvida para realização.'); } }); break;
    case 'fechar-os': await api.fecharOS(m); render(); toast(`${m.num} fechada.`); break;
    case 'nova-oc': modalNovaOC(m); break;
    case 'oc-estoque': modalNovaOC(null); break;
    case 'sem-cotacao': modalSemCotacao(m); break;
    /* OC */
    case 'cotar': modalCotacao(c); break;
    case 'escolher': await api.escolher(c, a.dataset.q); render(); break;
    case 'rm-cot': e.stopPropagation(); await api.removerCotacao(c, a.dataset.q); render(); break;
    case 'cancelar-compra': modalJustificar({ titulo:'Cancelar OC', texto:'A OC ainda não tem número. Ela sai das pendências.', label:'Motivo', obrig:true, botao:'Cancelar OC', onOk: async t => { await api.cancelarCompra(c, t); closeModal(); render(); toast('OC cancelada.'); } }); break;
    case 'aprovar': case 'enviar': modalFecharCompra(c, act === 'aprovar'); break;
    case 'aprovar-direto': { const oc = await api.aprovar(c, null, null); toast(`${oc.num} gerada.`); go('oc', oc.id); break; }
    case 'reprovar': modalJustificar({ titulo: c.semCotacao ? 'Reprovar compra sem cotação' : 'Reprovar compra', texto: c.semCotacao ? 'O pedido volta como uma OC normal, que precisa ser cotada.' : 'A compra volta para cotação com o seu motivo.', label:'Motivo', obrig:true, botao:'Reprovar', onOk: async t => { await api.reprovar(c, t); closeModal(); render(); toast('Compra reprovada.'); } }); break;
    case 'entrega': modalEntrega(o); break;
    case 'posterior': modalPosterior(o); break;
    case 'cancelar-oc': modalJustificar({ titulo:`Cancelar ${esc(o.num)}`, texto:'O número fica marcado como CANCELADO e nunca é reaproveitado. Avise o fornecedor e o financeiro.', label:'Motivo', obrig:true, botao:'Cancelar OC', onOk: async t => { await api.cancelarOC(o, t); closeModal(); render(); toast(`${o.num} cancelada.`); } }); break;
    case 'oc-f': V.ocF = a.dataset.v; render(); break;
    case 'push-on': await ativarPush(); render(); toast('Avisos ativados.'); break;
    case 'push-off': await desativarPush(); render(); toast('Avisos desativados neste aparelho.'); break;
    case 'copiar': {
      const t = a.dataset.v;
      try { await navigator.clipboard.writeText(t); toast('Número copiado.'); }
      catch (err) { const el = document.getElementById('oc-num'); if (el) { const r = document.createRange(); r.selectNodeContents(el); const s = getSelection(); s.removeAllRanges(); s.addRange(r); } toast('Número selecionado. Copie com o toque longo.'); }
      break; }
    case 'csv': exportCSV(); break;
    /* cadastros */
    case 'forn-edit': fornVolta = null; modalFornecedor(a.dataset.id ? forn(a.dataset.id) : null, false); break;
    case 'veic-edit': modalVeiculo(a.dataset.id ? S.veiculos.find(v => v.id === a.dataset.id) : null); break;
    case 'user-edit': modalUsuario(a.dataset.id ? user(a.dataset.id) : null); break;
    case 'user-senha': modalRedefinir(user(a.dataset.id)); break;
  }
  } catch (err) { console.error(err); toast(err.message || 'Algo deu errado. Tente de novo.', true); }
  finally { setBusy(false); }
});

document.addEventListener('submit', async e => {
  e.preventDefault();
  if (busy) return;
  setBusy(true);
  try { await onSubmit(e); }
  catch (err) { console.error(err); toast(err.message || 'Algo deu errado. Tente de novo.', true); }
  finally { setBusy(false); }
});
async function onSubmit(e){
  if (e.target.id === 'mform' && modalOnSubmit) return modalOnSubmit();
  if (e.target.id === 'form-nova') return submitNova();
  if (e.target.id === 'form-login') {
    loginErro = '';
    const ident = val('lg-email').trim();
    let email = ident;
    if (!ident.includes('@')) {
      const t = normTel(ident);
      if (!t) { loginErro = 'Digite o celular com DDD, por exemplo (15) 99999-0000.'; render(); setVal('lg-email', ident); return; }
      email = `${t}@${TEL_DOM}`;
    }
    const { data, error } = await sb.auth.signInWithPassword({ email, password: val('lg-senha') });
    if (error) { loginErro = error.message === 'Invalid login credentials' ? 'Celular ou senha incorretos.' : error.message; render(); setVal('lg-email', ident); return; }
    await entrarRemoto(data.user); return;
  }
  if (e.target.id === 'form-config') {
    const n = id => parseR(val(id)) ?? 0;
    await api.salvarConfig({ alcada: { motorista: n('cf-mot'), mecanico: n('cf-mec'), analista: n('cf-ana') }, cotMin: n('cf-min') });
    toast('Regras salvas.'); render();
  }
}

document.addEventListener('input', e => {
  const el = e.target;
  if (el.dataset.draft && draft) { draft[el.dataset.draft] = el.value; return; }
  if (el.id === 'busca-fila') { V.busca = el.value; const pos = el.selectionStart; render(); const n = document.getElementById('busca-fila'); n.focus(); n.setSelectionRange(pos, pos); }
  if (el.id === 'busca-oc') { V.ocBusca = el.value; const pos = el.selectionStart; render(); const n = document.getElementById('busca-oc'); n.focus(); n.setSelectionRange(pos, pos); }
});

document.addEventListener('change', async e => {
  const el = e.target;
  if (el.id === 'placa-fila' || el.id === 'placa-fila-m') { V.placa = el.value; render(); }
  if (el.id === 'ms-forn' && !val('ms-wa')) setVal('ms-wa', fmtTel(forn(el.value)?.whatsapp || ''));
  if (el.id === 'd-fotos') {
    const files = [...el.files].slice(0, 8);
    for (const f of files) { try { draft.fotos.push(await compressImage(f)); } catch (err) { toast('Não consegui ler uma das fotos.', true); } }
    render();
  }
  if (el.id === 'mc-anexo' && el.files[0]) { try { modalAnexo = await compressImage(el.files[0], 1400, 0.7); } catch (err) { toast('Não consegui ler o anexo.', true); } }
  if (el.id === 'en-foto' && el.files[0]) { try { entregaFoto = await compressImage(el.files[0], 1400, 0.7); const p = document.getElementById('en-prev'); if (p) p.innerHTML = photosHtml([entregaFoto], false, 'en-prev'); } catch (err) { toast('Não consegui ler a foto.', true); } }
  if (el.id === 'mp-anexo' && el.files[0]) { try { postAnexo = await compressImage(el.files[0], 1400, 0.7); } catch (err) { toast('Não consegui ler o anexo.', true); } }
});
document.addEventListener('keydown', e => { if (e.key === 'Escape' && document.querySelector('#modal-root .modal')) closeModal(); });

function exportCSV(){
  const cab = ['OC', 'Data aprovação', 'Placa / destino', 'OS', 'Fornecedor', 'CNPJ', 'Item / serviço', 'Tipo', 'Valor aprovado', 'Sem cotação', 'Situação', 'Aprovado por', 'Entregue em', 'WhatsApp de envio', 'Motivo do cancelamento'];
  const linhas = visOrdens().map(o => { const m = osById(o.osId), c = compraDeOC(o), f = forn(o.fornecedorId);
    return [o.num, fmtD(o.aprovadoEm), alvoTxt(o), m?.num || '', f?.nome || '', f?.cnpj || '', c?.descricao || '', TIPOS[o.tipo] || o.tipo, String(o.valor.toFixed(2)).replace('.', ','),
      o.semCotacao ? 'Sim' : 'Não', stOCtxt(o)[0], nomeU(o.aprovadoPor), o.entregueEm ? fmtD(o.entregueEm) : '', fmtTel(o.whatsapp), o.canceladaMotivo || '']; });
  const csv = '﻿' + [cab, ...linhas].map(r => r.map(v => `"${String(v).replace(/"/g, '""')}"`).join(';')).join('\r\n');
  try {
    const url = URL.createObjectURL(new Blob([csv], { type:'text/csv;charset=utf-8' }));
    const a = document.createElement('a'); a.href = url; a.download = `ordens-de-compra-${new Date().toISOString().slice(0, 10)}.csv`;
    document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(url), 2000);
    toast('Planilha gerada.');
  } catch (err) { toast('Não foi possível baixar a planilha neste navegador.', true); }
}

/* ---------- início ---------- */
async function boot(){
  if (!(CFG.supabaseUrl && CFG.supabaseAnonKey && window.supabase)) { document.getElementById('app').innerHTML = '<div class="login"><div class="notice bad"><span>Configuração do servidor não encontrada (config.js).</span></div></div>'; return; }
  sb = window.supabase.createClient(CFG.supabaseUrl, CFG.supabaseAnonKey, { auth: { persistSession: true, autoRefreshToken: true } });
  sb.auth.onAuthStateChange((ev) => {
    if (ev === 'PASSWORD_RECOVERY') setTimeout(() => modalSenha(true), 300);
    if (ev === 'SIGNED_OUT') { ME = null; render(); }
  });
  document.getElementById('app').innerHTML = '<div class="login"><span class="muted">Carregando…</span></div>';
  const { data: { session } } = await sb.auth.getSession();
  if (session) await entrarRemoto(session.user); else render();
}
boot();
let lastW = window.innerWidth;
window.addEventListener('resize', () => { if ((lastW <= 820) !== (window.innerWidth <= 820)) render(); lastW = window.innerWidth; });
if ('serviceWorker' in navigator && location.protocol === 'https:') { try { navigator.serviceWorker.register('sw.js').catch(() => {}); } catch (e) {} }
</script>
