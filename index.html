<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Manutenção">
<title>Barreto Manutenção</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="theme-color" content="#0B2A6B">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/favicon.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700;800&family=Barlow+Semi+Condensed:wght@700;800&display=swap">
<style>
/* Tema único claro, igual ao esboço. Layout: barra lateral + conteúdo + painel de totais no computador; cabeçalho + navegação inferior no celular */
:root{
  --navy:#0B2A6B; --navy-ink:#061A45; --orange:#FF9100; --on-orange:#172033;
  --bg:#F3F5F9; --surface:#FFFFFF; --surface-2:#EEF1F7; --line:#E2E6EE; --line-2:#CDD3DF;
  --fg:#172033; --fg-2:#3A4458; --muted:#5B6478; --heading:#0B2A6B;
  --primary:#0B2A6B; --on-primary:#FFFFFF; --bar:#0B2A6B; --on-bar:#FFFFFF; --on-bar-2:#C9D3EA;
  --ok-bg:#E3F4EA; --ok:#1A6B3A; --warn-bg:#FFF1DB; --warn:#8A4B00; --bad-bg:#FDE7E6; --bad:#A1231B;
  --info-bg:#E7ECF7; --info:#1E3A7A; --sel:#EEF2FA; --logo-bg:transparent; --shadow:0 1px 2px rgba(11,42,107,.08);
  --plate-inv-bg:#FFFFFF; --plate-inv-fg:#0B2A6B; --bar-hover:rgba(255,255,255,.12);
  color-scheme:light;
  --f-display:"Barlow Semi Condensed","Barlow","Arial Narrow",system-ui,sans-serif;
  --f-body:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;
}

*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:15px;line-height:1.4}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--surface)}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--heading)}
:focus-visible{outline:3px solid var(--orange);outline-offset:2px}
h1,h2,h3{margin:0;text-wrap:balance}
.num{font-variant-numeric:tabular-nums}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}

/* estrutura */
.shell{display:flex;min-height:100%}
.side{width:236px;flex:none;background:var(--surface);border-right:1px solid var(--line);padding:20px 12px;display:flex;flex-direction:column;gap:2px;position:sticky;top:0;height:100vh;overflow:auto}
.side .logo{margin:0 8px 18px;background:var(--logo-bg);border-radius:8px;padding:4px 6px}
.side .logo img{display:block;width:180px;height:auto}
.nav-i{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:8px;border:0;background:none;color:var(--fg-2);font-weight:600;font-size:15px;text-align:left;cursor:pointer;width:100%}
.nav-i:hover{background:var(--surface-2)}
.nav-i[aria-current="page"]{background:var(--primary);color:var(--on-primary)}
.nav-i .badge{margin-left:auto}
.side .sep{height:1px;background:var(--line);margin:10px 8px}
.side .who{margin-top:auto;padding:12px;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:6px}
.main{flex:1;min-width:0;display:flex;flex-direction:column}
.content{flex:1;width:100%;max-width:1180px;margin:0 auto;padding-block:22px 40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:16px}
.with-panel{display:flex;gap:20px;align-items:flex-start}
.with-panel>.col{flex:1;min-width:0;display:flex;flex-direction:column;gap:16px}
.panel{width:290px;flex:none;display:flex;flex-direction:column;gap:12px;position:sticky;top:22px}
.mtop{display:none}
.bnav{display:none}
.fab{display:none}
@media (max-width:1180px){.panel{display:none}}
@media (max-width:820px){
  .side{display:none}
  .mtop{display:flex;align-items:center;justify-content:space-between;gap:10px;position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line);padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
  .mtop .logo{background:var(--logo-bg);border-radius:6px;padding:2px 4px}
  .mtop img{height:28px;width:auto;display:block}
  .content{padding-bottom:calc(150px + env(safe-area-inset-bottom,0px));padding-top:16px}
  .bnav{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
  .bnav button{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:3px;padding:10px 0 8px;font-size:12px;font-weight:600;color:var(--muted);position:relative;cursor:pointer;min-height:60px}
  .bnav button[aria-current="page"]{color:var(--heading);font-weight:800}
  .bnav .badge{position:absolute;top:6px;left:58%}
  .fab{display:flex;position:fixed;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(76px + env(safe-area-inset-bottom,0px));z-index:21;height:56px;padding:0 22px;border-radius:28px;border:0;background:var(--primary);color:var(--on-primary);align-items:center;gap:8px;font-weight:800;font-size:16px;box-shadow:0 6px 16px rgba(11,42,107,.3);cursor:pointer}
  .hide-m{display:none!important}
}

/* componentes */
.page-h{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.page-h h1{font-family:var(--f-display);font-size:30px;font-weight:800;color:var(--heading);letter-spacing:.2px}
.page-h .sub{color:var(--muted);font-size:14px}
.page-h .right{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}
.card{background:var(--surface);border-radius:14px;box-shadow:var(--shadow);border:1px solid var(--line)}
.card.pad{padding:16px}
.card h2{font-size:17px;font-weight:800}
.stack{display:flex;flex-direction:column;gap:10px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.btn{height:44px;padding:0 16px;border-radius:10px;border:1px solid var(--line-2);background:var(--surface);color:var(--heading);font-weight:700;font-size:15px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px;text-decoration:none;white-space:nowrap}
.btn:hover{background:var(--surface-2)}
.btn.primary{background:var(--primary);border-color:var(--primary);color:var(--on-primary)}
.btn.primary:hover{filter:brightness(1.1)}
.btn.orange{background:var(--orange);border-color:var(--orange);color:var(--on-orange)}
.btn.danger{color:var(--bad)}
.btn.sm{height:36px;padding:0 12px;font-size:14px;border-radius:8px}
.btn.block{width:100%;height:52px;font-size:16px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.plate{font-weight:800;letter-spacing:.6px;font-size:14px;background:var(--surface-2);border:1px solid var(--line-2);border-radius:6px;padding:1px 8px;white-space:nowrap;color:var(--fg)}
.pill{display:inline-flex;align-items:center;font-size:12px;font-weight:700;border-radius:20px;padding:3px 10px;white-space:nowrap}
.pill.neutral{background:var(--surface-2);color:var(--fg-2)}
.pill.info{background:var(--info-bg);color:var(--info)}
.pill.warn{background:var(--warn-bg);color:var(--warn)}
.pill.bad{background:var(--bad-bg);color:var(--bad)}
.pill.ok{background:var(--ok-bg);color:var(--ok)}
.pill.urg{background:var(--orange);color:var(--on-orange);font-weight:800;letter-spacing:.4px}
.pill.prog{background:var(--primary);color:var(--on-primary);font-weight:800;letter-spacing:.4px}
.badge{background:var(--orange);color:var(--on-orange);font-size:11px;font-weight:800;border-radius:10px;padding:1px 7px;line-height:1.5}
.muted{color:var(--muted)}
.small{font-size:13px}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;background:var(--surface-2);border-radius:12px;padding:4px;gap:4px;border:1px solid var(--line)}
.seg button{border:0;border-radius:9px;background:transparent;color:var(--fg-2);font-weight:600;font-size:15px;height:42px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--orange);color:var(--on-orange);font-weight:800}
.seg.blue button[aria-pressed="true"]{background:var(--primary);color:var(--on-primary)}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{border:1px solid var(--line-2);background:var(--surface);border-radius:20px;padding:0 14px;height:36px;font-size:14px;font-weight:600;cursor:pointer;color:var(--fg-2)}
.chip[aria-pressed="true"]{background:var(--primary);border-color:var(--primary);color:var(--on-primary)}
.chip.plate-chip{border-radius:8px;font-weight:800;letter-spacing:.5px;height:42px}

/* fila */
.qhead{display:flex;align-items:center;gap:10px;padding:12px 16px;border-bottom:1px solid var(--line)}
.dot{width:10px;height:10px;border-radius:5px;flex:none}
.qrow{display:grid;grid-template-columns:64px 100px minmax(0,1fr) 130px 190px 96px 62px;gap:12px;align-items:center;padding:11px 16px;border:0;border-bottom:1px solid var(--line);background:none;width:100%;text-align:left;cursor:pointer;font-size:14px;color:var(--fg)}
.qrow:hover{background:var(--surface-2)}
.qrow:last-child{border-bottom:0}
.qscroll{overflow-x:auto}
.qscroll .qrow{min-width:780px}
.qcard{display:flex;flex-direction:column;gap:7px;padding:14px;border:1px solid var(--line);border-radius:14px;background:var(--surface);box-shadow:var(--shadow);text-align:left;width:100%;cursor:pointer;color:var(--fg)}
.qcard .t{font-size:17px;font-weight:700;line-height:1.25}
.qcard .meta{display:flex;gap:12px;font-size:13px;color:var(--muted);flex-wrap:wrap;align-items:center}
.qlist-m{display:none;flex-direction:column;gap:10px}
@media (max-width:820px){.qdesk{display:none}.qlist-m{display:flex}}
.empty{padding:28px 16px;text-align:center;color:var(--muted)}
.tag-sug{font-size:11px;font-weight:700;color:var(--warn);border:1px dashed var(--warn);border-radius:20px;padding:1px 8px}

/* stats */
.stat{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px}
.stat .l{display:block;font-size:12px;color:var(--muted)}
.stat .v{font-size:24px;font-weight:800;font-variant-numeric:tabular-nums}
.stat.hero{background:var(--bar);color:var(--on-bar);border:0}
.stat.hero .l{color:var(--on-bar-2)}
.stat.hero .v{font-size:28px}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.bar{height:8px;border-radius:4px;background:var(--primary)}
.mstats{display:none;gap:8px;overflow-x:auto}
@media (max-width:1180px){.mstats{display:flex}.mstats .stat{flex:1 0 140px}}

/* formulários */
.field{display:flex;flex-direction:column;gap:6px}
.field>label,.field>.lbl{font-size:14px;font-weight:700;color:var(--fg-2)}
.input,select.input,textarea.input{width:100%;min-height:46px;border:1px solid var(--line-2);border-radius:10px;padding:10px 12px;background:var(--surface);font-size:16px}
textarea.input{resize:vertical;min-height:84px}
.hint{font-size:12px;color:var(--muted)}
.fgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
@media (max-width:560px){.fgrid{grid-template-columns:1fr}}
.photos{display:grid;grid-template-columns:repeat(auto-fill,minmax(76px,1fr));gap:8px}
.photo{aspect-ratio:1;max-width:100%;border-radius:10px;overflow:hidden;position:relative;background:var(--surface-2);border:0;padding:0;cursor:zoom-in}
.photo img{width:100%;height:100%;object-fit:cover;display:block}
.photo .x{position:absolute;top:4px;right:4px;width:26px;height:26px;border-radius:13px;border:0;background:rgba(0,0,0,.6);color:#fff;font-weight:800;cursor:pointer}
.addphoto{aspect-ratio:1;max-width:100%;border-radius:10px;border:2px dashed var(--line-2);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;color:var(--heading);font-size:12px;font-weight:700;cursor:pointer;background:var(--surface)}
.addphoto input{position:absolute;width:1px;height:1px;opacity:0}
.switch{display:flex;gap:12px;align-items:flex-start;padding:12px;border-radius:12px;border:1px solid var(--line-2);background:var(--surface);cursor:pointer}
.switch input{width:22px;height:22px;margin:2px 0 0;accent-color:var(--bad);flex:none}
.switch.on{border-color:var(--bad);background:var(--bad-bg)}
.emerg{border:1px solid var(--bad);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:12px}

/* detalhe */
.dhead{display:flex;flex-direction:column;gap:10px}
.dhead .top{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.dhead h1{font-family:var(--f-display);font-size:28px;font-weight:800;color:var(--heading);line-height:1.15}
.steps{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:4px}
.steps span{height:6px;border-radius:3px;background:var(--line-2)}
.steps span.done{background:var(--primary)}
.steps span.now{background:var(--orange)}
.steps-l{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:4px;font-size:11px;font-weight:600;color:var(--muted)}
.steps-l .now{color:var(--warn);font-weight:800}
.dgrid{display:flex;gap:16px;align-items:flex-start;flex-wrap:wrap}
.dgrid>.a{flex:1 1 320px;min-width:0;display:flex;flex-direction:column;gap:14px}
.dgrid>.b{flex:2 1 460px;min-width:0;display:flex;flex-direction:column;gap:14px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:14px}
.kv dt{color:var(--muted)}
.kv dd{margin:0;font-weight:600;min-width:0}
.hist{display:flex;flex-direction:column;gap:8px;font-size:13px}
.hist div{display:grid;grid-template-columns:92px 1fr;gap:8px}
.compra{border:1px solid var(--line);border-radius:14px;background:var(--surface);overflow:hidden}
.compra .ch{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:12px 16px;border-bottom:1px solid var(--line)}
.compra .ch h3{font-size:16px;font-weight:800}
.cot{display:grid;grid-template-columns:28px minmax(140px,1fr) auto;gap:4px 10px;align-items:center;padding:12px 16px;border:0;border-bottom:1px solid var(--line);background:none;width:100%;text-align:left;cursor:pointer;color:var(--fg)}
.cot:disabled{cursor:default}
.cot .radio{width:18px;height:18px;border-radius:9px;border:2px solid var(--line-2)}
.cot.sel{background:var(--sel)}
.cot.sel .radio{border:5px solid var(--primary)}
.cot .f{font-weight:700}
.cot .v{font-weight:800;text-align:right;font-variant-numeric:tabular-nums}
.cot .m{grid-column:2/4;font-size:13px;color:var(--muted)}
.notice{border-radius:12px;padding:12px;font-size:14px;display:flex;flex-direction:column;gap:4px}
.notice.warn{background:var(--warn-bg);color:var(--warn)}
.notice.ok{background:var(--ok-bg);color:var(--ok)}
.notice.bad{background:var(--bad-bg);color:var(--bad)}
.notice.info{background:var(--info-bg);color:var(--info)}
.notice b{font-weight:800}
.actions{display:flex;gap:10px;flex-wrap:wrap;padding:12px 16px;border-top:1px solid var(--line)}

/* OC */
.ocbig{background:var(--bar);color:var(--on-bar);border-radius:16px;padding:20px;display:flex;flex-direction:column;align-items:center;gap:4px;text-align:center}
.ocbig .l{font-size:12px;font-weight:700;letter-spacing:1.2px;color:var(--on-bar-2)}
.ocbig .n{font-family:var(--f-display);font-size:48px;font-weight:800;letter-spacing:1px;font-variant-numeric:tabular-nums;line-height:1.1}
.olist{display:flex;flex-direction:column}
.orow{display:grid;grid-template-columns:120px 100px minmax(160px,1fr) 120px 150px;gap:12px;align-items:center;padding:12px 16px;border:0;border-bottom:1px solid var(--line);background:none;width:100%;text-align:left;cursor:pointer;color:var(--fg);font-size:14px}
.orow:hover{background:var(--surface-2)}
@media (max-width:820px){.orow{grid-template-columns:1fr auto;gap:4px 10px}.orow .hm{display:none}}

/* modal e toast */
.modal{position:fixed;inset:0;z-index:50;background:rgba(6,15,35,.55);display:flex;align-items:flex-end;justify-content:center;padding:max(12px,env(safe-area-inset-top,0px)) max(12px,env(safe-area-inset-right,0px)) 0 max(12px,env(safe-area-inset-left,0px))}
@media (min-width:821px){.modal{align-items:center;padding:24px}}
.sheet{background:var(--surface);color:var(--fg);width:100%;max-width:560px;max-height:92vh;overflow:auto;border-radius:18px 18px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:14px}
@media (min-width:821px){.sheet{border-radius:18px;padding:22px}}
.sheet h2{font-family:var(--f-display);font-size:24px;font-weight:800;color:var(--heading)}
.sheet .foot{display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap}
.viewer img{width:100%;height:auto;border-radius:10px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(150px + env(safe-area-inset-bottom,0px));z-index:60;background:var(--fg);color:var(--bg);padding:12px 18px;border-radius:12px;font-weight:600;max-width:min(92vw,480px);box-shadow:0 8px 24px rgba(0,0,0,.25)}
@media (min-width:821px){.toast{bottom:28px}}
.toast.bad{background:var(--bad);color:#fff}

/* login */
.login{min-height:100%;display:flex;align-items:center;justify-content:center;padding-block:32px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.login .box{width:100%;max-width:420px;display:flex;flex-direction:column;gap:18px}
.login .logo{background:var(--logo-bg);border-radius:10px;padding:8px;align-self:center}
.login .logo img{width:300px;max-width:100%;display:block}
.ubtn{display:flex;align-items:center;gap:12px;padding:12px 14px;border:1px solid var(--line);border-radius:12px;background:var(--surface);cursor:pointer;width:100%;text-align:left;color:var(--fg)}
.ubtn:hover{border-color:var(--primary)}
.av{width:38px;height:38px;border-radius:19px;background:var(--primary);color:var(--on-primary);font-weight:800;display:flex;align-items:center;justify-content:center;flex:none;font-size:14px}
.banner{background:var(--info-bg);color:var(--info);border-radius:12px;padding:10px 14px;font-size:13px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.tbl{width:100%;border-collapse:collapse;font-size:14px}
.tbl th{text-align:left;font-size:12px;color:var(--muted);font-weight:700;padding:10px 12px;background:var(--surface-2)}
.tbl td{padding:10px 12px;border-top:1px solid var(--line);vertical-align:middle}

/* visual do esboço */
.m-only{display:none}
.hero{background:var(--bar);color:var(--on-bar);border-radius:16px;padding:18px 22px 20px;display:flex;flex-direction:column;gap:10px}
.hero .top{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.hbtn{width:44px;height:44px;margin-left:-10px;border:0;background:none;color:var(--on-bar);display:flex;align-items:center;justify-content:center;border-radius:10px;cursor:pointer;flex:none}
.hbtn:hover{background:var(--bar-hover)}
.plate.stock{background:var(--warn-bg);color:var(--warn);border-color:var(--warn-bg)}
.plate.inv.stock{background:var(--orange);color:var(--on-orange);border-color:var(--orange)}
.plate.inv{background:var(--plate-inv-bg);color:var(--plate-inv-fg);border-color:var(--plate-inv-bg);font-size:15px}
.hnum{color:var(--on-bar-2);font-size:14px}
.hpills{display:flex;gap:6px;margin-left:auto;align-items:center}
.tag-sug.inv{color:var(--orange);border-color:var(--orange)}
.hero h1{font-family:var(--f-display);font-size:30px;font-weight:800;line-height:1.15;color:var(--on-bar)}
.hfoot{display:flex;align-items:flex-end;gap:10px;flex-wrap:wrap}
.thumbs{display:flex;gap:6px;align-items:flex-end}
.thumb{width:56px;height:56px;border-radius:8px;overflow:hidden;border:0;padding:0;background:var(--surface-2);cursor:zoom-in;flex:none}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.hmeta{color:var(--on-bar-2);font-size:13px}
.hst{margin-left:auto}
.subbar{display:flex;align-items:center;gap:12px}
.subbar h1{font-family:var(--f-display);font-size:30px;font-weight:800;color:var(--heading)}
.subbar .hbtn{color:var(--heading);margin-left:-6px}
.subbar .hbtn:hover{background:var(--surface-2)}
.sb-hint{margin-left:auto;color:var(--muted);font-size:13px}

/* ---------- dados ---------- */

    compras:[ { id:'c1', descricao:'Válvula + mão de obra', tipo:'ambos', status:'aprovacao', escolhidaId:'q1', justificativa:'Prazo: caminhão carregado aguardando', dispensa:null,
      solicitadaEm:H(0.6), solicitadaPor:'u2', ocId:null, motivoReprova:null,
      cotacoes:[ {id:'q1', fornecedorId:'f1', valor:1380, prazo:'Hoje 16h', pagamento:'28 dias', obs:'', anexo:null, por:'u2', em:H(0.8)},
                 {id:'q2', fornecedorId:'f2', valor:1520, prazo:'Amanhã 10h', pagamento:'À vista', obs:'', anexo:null, por:'u2', em:H(0.8)},

let S;
function load(){
  try { const r = localStorage.getItem(LS_DATA); if (r) return JSON.parse(r); } catch (e) {}

  if (m.cancelada) return 'cancelada';

  if (cs.some(c => c.status === 'aprovacao')) return 'aprovacao';
  const ocs = cs.map(c => ordem(c.ocId)).filter(Boolean);
  if (ocs.some(o => o.emergencial && !o.nf)) return 'emergencial';
  if (cs.some(c => c.status === 'cotacao' || c.status === 'reprovada')) return 'cotacao';
  if (ocs.some(o => o.status === 'divergente')) return 'divergente';

  return 'aberta';
}

};

  let n = pendentesAprovacao(u).length;

}

const log = (m, txt) => m.historico.push({ em: now(), por: ME.id, txt });

const apiLocal = {
  async criarDemanda(d){

      const c = { id: uid(), descricao: d.descricao, tipo: d.tipo, status: 'cotacao', escolhidaId: null, justificativa: e.justificativa,

      const q = { id: uid(), fornecedorId: e.fornecedorId, valor: e.valor, prazo: 'Imediato', pagamento: e.pagamento || '', obs: '', anexo: null, por: ME.id, em: now() };
      c.cotacoes.push(q); c.escolhidaId = q.id; m.compras.push(c);
      if (e.valor <= S.config.tetoEmergencial) {
        oc = gerarOC(m, c, true);
        log(m, `Compra emergencial: ${oc.num} gerada na hora (${fmtR(e.valor)})`);
      } else {
        c.status = 'aprovacao';
        log(m, `Compra emergencial acima do teto de ${fmtR(S.config.tetoEmergencial)}: enviada ao gestor como urgente`);
      }
    }
    persist();
    return { m, oc };
  },
  async compraEmergencial(m, e){
    const c = { id: uid(), descricao: e.descricao || m.descricao, tipo: m.tipo, status: 'cotacao', escolhidaId: null, justificativa: e.justificativa,
      dispensa: 'Compra emergencial', solicitadaEm: now(), solicitadaPor: ME.id, ocId: null, motivoReprova: null, cotacoes: [] };
    const q = { id: uid(), fornecedorId: e.fornecedorId, valor: e.valor, prazo: 'Imediato', pagamento: e.pagamento || '', obs: '', anexo: null, por: ME.id, em: now() };
    c.cotacoes.push(q); c.escolhidaId = q.id; m.compras.push(c);
    m.prioridade = 'urgente'; m.prioridadeConfirmada = true;
    let oc = null;
    if (e.valor <= S.config.tetoEmergencial) { oc = gerarOC(m, c, true); log(m, `Compra emergencial: ${oc.num} gerada na hora (${fmtR(e.valor)})`); }
    else { c.status = 'aprovacao'; log(m, `Compra emergencial de ${fmtR(e.valor)} acima do teto: enviada ao gestor`); }

  },
  async definirPrioridade(m, p){ m.prioridade = p; m.prioridadeConfirmada = true; log(m, `Definiu como ${p}`); persist(); },
  async atender(m){ m.atendidoPor = ME.id; log(m, 'Assumiu o atendimento'); persist(); },
  async comentar(m, txt){ log(m, 'Comentário: ' + txt); persist(); },
  async novaCompra(m, descricao, tipo){
    const c = { id: uid(), descricao, tipo, status: 'cotacao', escolhidaId: null, justificativa: '', dispensa: null, solicitadaEm: null,
      solicitadaPor: null, ocId: null, motivoReprova: null, cotacoes: [] };

  },
  async addCotacao(m, c, q){

    if (c.status === 'reprovada') c.status = 'cotacao';
    const menor = menorCot(c); c.escolhidaId = menor.id;
    log(m, `Cotação ${nomeF(q.fornecedorId)}: ${fmtR(q.valor)}`); persist();
  },
  async removerCotacao(m, c, qid){
    c.cotacoes = c.cotacoes.filter(q => q.id !== qid);
    if (c.escolhidaId === qid) c.escolhidaId = menorCot(c)?.id || null;
    log(m, 'Removeu uma cotação'); persist();
  },
  async escolher(m, c, qid){ c.escolhidaId = qid; persist(); },
  async enviarAprovacao(m, c, justificativa, dispensa){
    if (justificativa != null) c.justificativa = justificativa;
    if (dispensa) c.dispensa = dispensa;
    c.status = 'aprovacao'; c.solicitadaEm = now(); c.solicitadaPor = ME.id; c.motivoReprova = null;
    log(m, `Enviou ${fmtR(valorCompra(c))} para aprovação`); persist();
  },
  async aprovar(m, c, justificativa, dispensa){
    if (justificativa != null) c.justificativa = justificativa;
    if (dispensa) c.dispensa = dispensa;
    if (!c.solicitadaEm) { c.solicitadaEm = now(); c.solicitadaPor = ME.id; }
    const oc = gerarOC(m, c, false);
    log(m, `Aprovou e gerou ${oc.num} (${fmtR(oc.valor)})`); persist(); return oc;
  },
  async reprovar(m, c, motivo){ c.status = 'reprovada'; c.motivoReprova = motivo; log(m, `Reprovou: ${motivo}`); persist(); },
  async cancelarCompra(m, c){ c.status = 'cancelada'; log(m, `Cancelou a compra "${c.descricao}"`); persist(); },
  async registrarNF(o, nf){
    o.nf = { ...nf, por: ME.id, em: now() };

    o.status = nf.valor > lim ? 'divergente' : 'recebida';
    const m = manut(o.manutencaoId);
    if (m) log(m, `Registrou NF ${nf.numero || ''} de ${fmtR(nf.valor)} na ${o.num}` + (o.status === 'divergente' ? ' — acima da tolerância, foi para o gestor' : ''));
    persist();
    return o.status;
  },
  async aceitarDivergencia(o){
    o.status = 'recebida'; o.divergenciaAceitaPor = ME.id;
    const m = manut(o.manutencaoId); if (m) log(m, `Aceitou a diferença da NF na ${o.num}`); persist();
  },
  async revisarEmergencial(o){
    o.revisadaPor = ME.id; o.revisadaEm = now();
    const m = manut(o.manutencaoId); if (m) log(m, `Revisou a compra emergencial ${o.num}`); persist();
  },
  async encerrar(m){ m.encerradaEm = now(); log(m, 'Encerrou a manutenção'); persist(); },
  async reabrir(m){ m.encerradaEm = null; log(m, 'Reabriu a manutenção'); persist(); },
  async cancelarManut(m, motivo){ log(m, 'Motivo do cancelamento: ' + motivo); m.cancelada = true; log(m, 'Cancelou a manutenção'); persist(); },
  async salvarFornecedor(f){
    if (f.id) Object.assign(forn(f.id), f); else { f.id = uid(); S.fornecedores.push(f); }
    persist(); return f;
  },
  async salvarVeiculo(v){
    v.placa = normPlaca(v.placa);
    if (v.id) Object.assign(S.veiculos.find(x => x.id === v.id), v); else { v.id = uid(); S.veiculos.push(v); }
    persist();
  },
  async salvarUsuario(u){
    if (u.id) Object.assign(user(u.id), u); else { u.id = uid(); S.users.push(u); }
    persist();
  },
  async redefinirSenha(){},
  async salvarConfig(c){ S.config = c; persist(); }
};

const fotoURL = {};          // caminho no Storage → link assinado
const histCache = {};        // histórico carregado sob demanda
const num = v => v == null ? null : Number(v);
async function rpc(fn, args){
  const { data, error } = await sb.rpc(fn, args);
  if (error) throw new Error(error.message);
  return data;
}
async function run(fn, args){ await rpc(fn, args); await reload(); }
async function assinar(paths){
  const falta = [...new Set(paths.filter(p => p && !fotoURL[p]))];
  if (!falta.length) return;
  const { data } = await sb.storage.from('fotos').createSignedUrls(falta, 60 * 60 * 12);
  (data || []).forEach(d => { if (d.signedUrl) fotoURL[d.path] = d.signedUrl; });
}
const furl = p => p ? (fotoURL[p] || '') : null;
async function uploadFoto(dataUrl, pasta){
  const blob = await (await fetch(dataUrl)).blob();
  const path = `${pasta}/${new Date().toISOString().slice(0, 7)}/${uid()}.jpg`;
  const { error } = await sb.storage.from('fotos').upload(path, blob, { contentType: 'image/jpeg', upsert: false });
  if (error) throw new Error('Não consegui enviar a foto: ' + error.message);
  fotoURL[path] = dataUrl;
  return path;
}
async function reload(){
  const q = async (b) => { const { data, error } = await b; if (error) throw new Error(error.message); return data; };
  const [p, cfg, vs, fs, ms, cs, qs, os] = await Promise.all([
    q(sb.from('profiles').select('*').order('nome')),
    q(sb.from('config').select('*').eq('id', 1).single()),
    q(sb.from('veiculos').select('*').eq('ativo', true).order('placa')),
    q(sb.from('fornecedores').select('*').order('nome')),
    q(sb.from('manutencoes').select('*').order('aberto_em', { ascending: false }).limit(1000)),
    q(sb.from('compras').select('*').order('criado_em').limit(5000)),
    q(sb.from('cotacoes').select('*').order('em').limit(10000)),
    q(sb.from('ordens').select('*').order('aprovado_em', { ascending: false }).limit(5000))
  ]);
  await assinar([...ms.flatMap(m => m.fotos || []), ...qs.map(x => x.anexo), ...os.map(o => o.nf_foto)]);
  const cotPor = {}; qs.forEach(x => (cotPor[x.compra_id] ||= []).push({ id: x.id, fornecedorId: x.fornecedor_id, valor: num(x.valor), prazo: x.prazo, pagamento: x.pagamento, obs: x.obs, anexo: furl(x.anexo), por: x.por, em: x.em }));
  const compPor = {}; cs.forEach(c => (compPor[c.manutencao_id] ||= []).push({ id: c.id, descricao: c.descricao, tipo: c.tipo, status: c.status, escolhidaId: c.escolhida_id,
    justificativa: c.justificativa, dispensa: c.dispensa, solicitadaEm: c.solicitada_em, solicitadaPor: c.solicitada_por, ocId: c.oc_id, motivoReprova: c.motivo_reprova, cotacoes: cotPor[c.id] || [] }));
  S = {

      faixas: [ { ate: num(cfg.faixa1), n: 1 }, { ate: num(cfg.faixa2), n: 2 }, { ate: null, n: 3 } ],

    veiculos: vs.map(v => ({ id: v.id, placa: v.placa, tipo: v.tipo, marca: v.marca, anoModelo: v.ano_modelo })),
    fornecedores: fs.map(f => ({ id: f.id, nome: f.nome, cnpj: f.cnpj, cidade: f.cidade, telefone: f.telefone, categoria: f.categoria, provisorio: f.provisorio })),
    manutencoes: ms.map(m => ({ id: m.id, num: m.num, destino: m.destino, placa: m.placa, descricao: m.descricao, tipo: m.tipo, prioridade: m.prioridade, prioridadeConfirmada: m.prioridade_confirmada,
      abertoPor: m.aberto_por, abertoEm: m.aberto_em, atendidoPor: m.atendido_por, fotos: (m.fotos || []).map(furl).filter(Boolean), encerradaEm: m.encerrada_em, cancelada: m.cancelada,
      historico: histCache[m.id] || [], compras: compPor[m.id] || [] })),
    ordens: os.map(o => ({ id: o.id, num: o.num, manutencaoId: o.manutencao_id, compraId: o.compra_id, destino: o.destino, placa: o.placa, fornecedorId: o.fornecedor_id, valor: num(o.valor), tipo: o.tipo,
      emergencial: o.emergencial, aprovadoPor: o.aprovado_por, aprovadoEm: o.aprovado_em, regularizarAte: o.regularizar_ate, revisadaPor: o.revisada_por, status: o.status,
      nf: o.nf_em ? { numero: o.nf_numero, valor: num(o.nf_valor), foto: furl(o.nf_foto), por: o.nf_por, em: o.nf_em } : null })),

  };

async function loadHist(mid){
  const { data, error } = await sb.from('historico').select('*').eq('manutencao_id', mid).order('em');
  if (error) return;
  histCache[mid] = data.map(h => ({ em: h.em, por: h.por, txt: h.txt }));
  const m = manut(mid); if (m) m.historico = histCache[mid];
}

function compressImage(file, max = 1280, q = 0.68){
  return new Promise((res, rej) => {
    const rd = new FileReader();
    rd.onerror = rej;
    rd.onload = () => {
      const img = new Image();
      img.onerror = rej;
      img.onload = () => {
        const k = Math.min(1, max / Math.max(img.width, img.height));
        const cv = document.createElement('canvas');
        cv.width = Math.round(img.width * k); cv.height = Math.round(img.height * k);
        cv.getContext('2d').drawImage(img, 0, 0, cv.width, cv.height);
        res(cv.toDataURL('image/jpeg', q));
      };
      img.src = rd.result;
    };
    rd.readAsDataURL(file);
  });
}

/* ---------- fila ---------- */
function totais(){
  const d = new Date(), ini = new Date(d.getFullYear(), d.getMonth(), 1);
  const mes = S.ordens.filter(o => o.status !== 'cancelada' && new Date(o.aprovadoEm) >= ini);
  const gasto = mes.reduce((a, o) => a + (o.nf ? o.nf.valor : o.valor), 0);
  const porPlaca = {};
  mes.forEach(o => { const k = alvoTxt(o); porPlaca[k] = (porPlaca[k] || 0) + (o.nf ? o.nf.valor : o.valor); });
  const placas = Object.entries(porPlaca).sort((a, b) => b[1] - a[1]).slice(0, 6);
  const tempos = [];
  S.manutencoes.forEach(m => m.compras.forEach(c => { const o = ordem(c.ocId); if (o && !o.emergencial && c.solicitadaEm && new Date(o.aprovadoEm) >= ini) tempos.push((new Date(o.aprovadoEm) - new Date(c.solicitadaEm)) / 3600e3); }));
  const tm = tempos.length ? tempos.reduce((a, b) => a + b, 0) / tempos.length : null;
  let aguard = 0; S.manutencoes.forEach(m => m.compras.forEach(c => { if (c.status === 'aprovacao') aguard++; }));
  return { gasto, nOC: mes.length, nPlacas: Object.keys(porPlaca).length, placas,
    aguard, emerg: S.ordens.filter(o => o.emergencial && !o.nf && o.status !== 'cancelada').length,
    pctEmerg: mes.length ? Math.round(100 * mes.filter(o => o.emergencial).length / mes.length) : 0,
    tm, mesNome: d.toLocaleDateString('pt-BR', { month:'long' }) };
}
const fmtH = h => h == null ? '—' : h < 1 ? `${Math.max(1, Math.round(h * 60))} min` : `${h.toFixed(1).replace('.', ',')} h`;

        ${[['', 'Todas'], ['minhas', 'Minhas'], ['aprovacao', 'Aguardando aprovação', cnt(m => statusManut(m) === 'aprovacao')], ['cotacao', 'Em cotação', cnt(m => statusManut(m) === 'cotacao')], ['emergencial', 'Emergenciais', cnt(m => statusManut(m) === 'emergencial')], ...(pode.prioridade(ME) && nTri ? [['triagem', 'Prioridade a confirmar', nTri]] : []), ['encerradas', 'Encerradas']]
          .map(([v, l, n]) => `<button class="chip" data-act="so" data-v="${v}" aria-pressed="${V.so === v}">${l}${n ? ' · ' + n : ''}</button>`).join('')}

      <div class="qlist-m">${mob.length ? mob.map(card).join('') : `<div class="card empty">Nenhuma demanda ${V.so === 'encerradas' ? 'encerrada' : V.tab === 'urgente' ? 'urgente' : 'programada'}.</div>`}</div>

  const stepl = lbls.map((l, i) => `<span class="${i === si && si < 5 ? 'now' : ''}">${l}</span>`).join('');
  const ativa = !['encerrada', 'cancelada'].includes(s);
  const compras = m.compras.filter(c => c.status !== 'cancelada');

  return `<div class="content">

        <span class="hst">${pillSt(s)}</span>
      </div>
    </section>
    ${s !== 'cancelada' ? `<div class="stack" style="gap:6px;max-width:560px"><div class="steps">${steps}</div><div class="steps-l">${stepl}</div></div>` : ''}
    ${pode.prioridade(ME) && ativa ? `<div class="row">
      ${!m.prioridadeConfirmada ? `<button class="btn sm primary" data-act="pri" data-v="${m.prioridade}">Confirmar como ${m.prioridade}</button>` : ''}

let barHtml = '';
function compraHtml(m, c){
  const q = escolhida(c), v = q?.valor ?? null, menor = menorCot(c);
  const nec = v != null ? cotNecessarias(v) : 1;
  const falta = Math.max(0, nec - c.cotacoes.length);
  const editavel = (c.status === 'cotacao' || c.status === 'reprovada') && pode.cotar(ME);
  const al = alcada(ME);
  const o = ordem(c.ocId);
  const stPill = { cotacao:'<span class="pill info">Em cotação</span>', reprovada:'<span class="pill bad">Reprovada · revisar</span>', aprovacao:'<span class="pill warn">Aguardando aprovação</span>', aprovada:`<span class="pill ok">${esc(o?.num || 'Aprovada')}</span>` }[c.status] || '';
  const anexoLnk = x => x.anexo ? `<span class="lnk" data-act="ver-anexo" data-c="${c.id}" data-q="${x.id}">ver</span>` : '';
  const cots = (c.cotacoes.length ? `<div class="cot-h"><span></span><span>Fornecedor</span><span>Valor</span><span>Prazo</span><span>Pagamento</span><span>Anexo</span></div>` : '') +
    c.cotacoes.slice().sort((a, b) => a.valor - b.valor).map(x => {
      const sel = x.id === c.escolhidaId;
      const extra = [x.obs && esc(x.obs), editavel && `<span class="lnk bad" data-act="rm-cot" data-c="${c.id}" data-q="${x.id}">remover</span>`].filter(Boolean).join(' · ');
      const mob = [x.prazo && esc(x.prazo), x.pagamento && 'pgto ' + esc(x.pagamento), x.anexo && `anexo: ${anexoLnk(x)}`].filter(Boolean).join(' · ');
      return `<${editavel ? 'button type="button"' : 'div'} class="cot ${sel ? 'sel' : ''}" ${editavel ? `data-act="escolher" data-c="${c.id}" data-q="${x.id}" aria-pressed="${sel}"` : ''}>
        <span class="radio"></span>
        <span class="f">${esc(nomeF(x.fornecedorId))}${forn(x.fornecedorId)?.provisorio ? ' <span class="tag-sug">provisório</span>' : ''}${sel ? ' <span class="pill info" style="font-size:11px;padding:1px 7px">ESCOLHIDA</span>' : ''}</span>
        <span class="v">${fmtR(x.valor)}${menor && x.id === menor.id && c.cotacoes.length > 1 ? ' <span class="pill ok" style="font-size:11px;padding:1px 6px">menor</span>' : ''}</span>
        <span class="c-d">${esc(x.prazo) || '—'}</span><span class="c-d">${esc(x.pagamento) || '—'}</span><span class="c-d">${anexoLnk(x) || '—'}</span>
        ${mob ? `<span class="m m-mob">${mob}</span>` : ''}
        ${extra ? `<span class="m">${extra}</span>` : ''}
      </${editavel ? 'button' : 'div'}>`;
    }).join('');
  const alcChips = `<span class="alc"><span class="pill neutral">Mecânico até ${fmtR(S.config.alcada.mecanico)}</span><span class="pill neutral">Analista até ${fmtR(S.config.alcada.analista)}</span><span class="pill warn">Gestor acima</span></span>`;

  let rodape = '';
  if (editavel && q) {
    const regra = falta === 0 ? `<div class="notice ok"><span>Regra da faixa cumprida: ${nec} cotação(ões) para ${fmtR(v)}.</span></div>`
      : `<div class="notice warn"><b>Faltam ${falta} cotação(ões).</b><span>Para ${fmtR(v)} a regra pede ${nec}. ${pode.dispensar(ME) ? 'Você pode dispensar com justificativa.' : 'Lance mais cotações ou peça ao analista para dispensar.'}</span></div>`;
    const naoMenor = menor && q.id !== menor.id;
    const podeAprovar = v <= al;
    const ok = falta === 0 || pode.dispensar(ME);
    const prim = ok ? `<button class="btn primary" data-act="${podeAprovar ? 'aprovar' : 'enviar'}" data-c="${c.id}" data-falta="${falta}" data-naomenor="${naoMenor ? 1 : 0}">${podeAprovar ? 'Aprovar e gerar OC' : 'Enviar para aprovação'}</button>` : '';
    const cot = `<button class="btn" data-act="cotar" data-c="${c.id}">${ic('plus', 18)} Cotação</button>`;
    barHtml = cot + prim;
    rodape = `<div style="padding:12px 16px" class="stack">${regra}
      ${c.motivoReprova ? `<div class="notice bad"><b>Reprovada:</b><span>${esc(c.motivoReprova)}</span></div>` : ''}
      ${podeAprovar ? '' : `<div class="notice warn"><b>Alçada exigida: ${quemAprova(v)}</b><span>${fmtR(v)} passa da sua alçada (${al === 0 ? 'sem alçada' : fmtR(al)}).</span>${alcChips}</div>`}</div>
      <div class="actions">
        <span class="pri-act">${cot}</span>
        ${pode.cancelar(ME) ? `<button class="btn danger" data-act="cancelar-compra" data-c="${c.id}">Cancelar compra</button>` : ''}
        <span style="flex:1"></span>

  } else if (editavel && !q) {
    const b = `<button class="btn primary" data-act="cotar" data-c="${c.id}">${ic('plus', 18)} Lançar cotação</button>`;
    barHtml = b;
    rodape = `<div class="actions pri-act">${b}</div>`;

    const btns = `<button class="btn danger" data-act="reprovar" data-c="${c.id}">Reprovar</button><button class="btn primary" data-act="aprovar-direto" data-c="${c.id}">Aprovar e gerar OC</button>`;

      ${eu ? `<div class="actions pri-act"><span style="flex:1"></span>${btns}</div>` : ''}`;

    const b = `<button class="btn ${o.nf ? '' : 'primary'}" data-go="oc" data-id="${o.id}">${o.nf ? 'Ver OC' : 'Abrir OC e registrar NF'}</button>`;
    if (!o.nf) barHtml = b;
    rodape = `<div class="actions"><span class="small muted" style="align-self:center">Aprovada por ${esc(nomeU(o.aprovadoPor))} · ${fmtDT(o.aprovadoEm)}</span><span style="flex:1"></span><span class="${o.nf ? '' : 'pri-act'}">${b}</span></div>`;
  }
  return `<section class="compra">
    <div class="ch"><h3>${esc(c.descricao)}</h3>${stPill}<span style="margin-left:auto" class="num"><b>${v != null ? fmtR(v) : ''}</b></span></div>
    ${c.cotacoes.length ? cots : '<div class="empty small">Sem cotações ainda.</div>'}
    ${rodape}
  </section>`;
}
function faixaDe(v){ for (const f of S.config.faixas) if (f.ate == null || v <= f.ate) return f.ate; return null; }
function quemAprova(v){
  const a = S.config.alcada;
  if (v <= a.mecanico) return 'Mecânico ou acima';
  if (v <= a.analista) return 'Analista ou gestor';
  return 'Gestor';
}

      const alcTxt = val('mu-alc').trim();
      const alc = alcTxt === '' ? null : parseR(alcTxt);
      if (alcTxt !== '' && (alc == null || alc < 0)) return toast('Alçada inválida. Use um valor em reais ou deixe em branco.', true);
      const dados = { ...(u ? { id: u.id } : {}), nome: n, perfil: val('mu-perfil'), placa: val('mu-placa'),
        ativo: u ? document.getElementById('mu-ativo')?.checked !== false : true, alcada: val('mu-perfil') === 'gestor' ? null : alc };
      if (novo && REMOTE) {
        const t = normTel(val('mu-tel')); if (!t) return toast('Celular inválido. Use DDD + número.', true);
        const sn = val('mu-senha'); if (sn.length < 6) return toast('A senha provisória precisa ter pelo menos 6 caracteres.', true);
        dados.telefone = t; dados.senha = sn;
      }
      await api.salvarUsuario(dados); closeModal(); render();
      toast(novo && REMOTE ? `Usuário criado. Login: ${fmtTel(dados.telefone)}` : 'Usuário salvo.');
    });
}
function modalRedefinir(u){
  openModal(`<h2>Redefinir senha</h2><p class="muted" style="margin:0">${esc(u.nome)} · ${u.telefone ? esc(fmtTel(u.telefone)) : esc(u.email || '')}</p>
    <form id="mform" class="stack"><div class="field"><label for="rs-senha">Nova senha provisória</label><input class="input" id="rs-senha" type="text" autocomplete="off" placeholder="mín. 6 caracteres"></div>
    <div class="foot"><button type="button" class="btn" data-act="fechar">Cancelar</button><button class="btn primary" type="submit">Redefinir</button></div></form>`,
    async () => { const sn = val('rs-senha'); if (sn.length < 6) return toast('A senha precisa ter pelo menos 6 caracteres.', true);
      await api.redefinirSenha(u, sn); closeModal(); toast('Senha redefinida. Passe a nova senha para a pessoa.'); });
}
let nfFoto = null;
function modalNF(o){
  nfFoto = null;
  openModal(`<h2>Recebimento · ${esc(o.num)}</h2><p class="muted" style="margin:0">Aprovado: <b class="num">${fmtR(o.valor)}</b>. Tolerância de ${String(S.config.toleranciaNF).replace('.', ',')}%.</p>
    <form id="mform" class="stack" style="gap:12px">
      <div class="fgrid">
        <div class="field"><label for="nf-num">Número da NF</label><input class="input" id="nf-num" inputmode="numeric"></div>
        <div class="field"><label for="nf-valor">Valor da NF (R$)</label><input class="input num" id="nf-valor" inputmode="decimal" value="${String(o.valor.toFixed(2)).replace('.', ',')}"></div>
      </div>
      <div class="field"><label for="nf-foto">Foto da NF</label><input class="input" id="nf-foto" type="file" accept="image/*" capture="environment"></div>
      <div class="foot"><button type="button" class="btn" data-act="fechar">Cancelar</button><button class="btn primary" type="submit">Registrar</button></div>
    </form>`, async () => {
      const v = parseR(val('nf-valor')); if (!v) return toast('Informe o valor da NF.', true);
      if (!nfFoto && !val('nf-num').trim()) return toast('Informe o número ou anexe a foto da NF.', true);
      const st = await api.registrarNF(o, { numero: val('nf-num').trim(), valor: v, foto: nfFoto });
      closeModal(); render();
      toast(st === 'divergente' ? 'NF acima da tolerância. Foi para o gestor.' : 'Recebimento registrado.', st === 'divergente');
    });
}
const val = id => document.getElementById(id)?.value ?? '';
const setVal = (id, v) => { const el = document.getElementById(id); if (el && v != null) el.value = v; };

/* =========================================================
   EVENTOS
   ========================================================= */
let busy = false;
function setBusy(b){ busy = b; document.body.style.cursor = b ? 'progress' : ''; }
document.addEventListener('click', async e => {
  if (busy) { e.preventDefault(); return; }
  const g = e.target.closest('[data-go]');
  if (g) { e.preventDefault(); if (g.closest('#modal-root')) closeModal(); if (g.dataset.go === 'nova' && V.view !== 'nova') draft = null; go(g.dataset.go, g.dataset.id || null); return; }
  const a = e.target.closest('[data-act]');
  if (!a) return;
  const act = a.dataset.act;
  if (act === 'modal-bg') { if (e.target === a) closeModal(); return; }
  e.preventDefault();
  const m = manut(a.dataset.m || V.id);
  const c = m?.compras.find(x => x.id === a.dataset.c);
  setBusy(true);
  try {
  switch (act) {
    case 'entrar': ME = user(a.dataset.id); lsSet(LS_USER, ME.id); V.so = ''; go('fila', null, { replace: true }); break;
    case 'sair': if (REMOTE) { await sb.auth.signOut(); } ME = null; lsSet(LS_USER, null); render(); break;
    case 'esqueci': {
      const em = val('lg-email').trim();
      if (em.includes('@')) {
        const { error } = await sb.auth.resetPasswordForEmail(em, { redirectTo: location.href.split('#')[0] });
        if (error) throw new Error(error.message);
        toast('Enviamos um link para criar nova senha no seu e-mail.'); break;
      }
      openModal(`<h2>Esqueci minha senha</h2><p style="margin:0">Peça ao gestor para redefinir a sua senha. Ele faz isso pelo app, em Cadastros › Usuários, e passa uma senha provisória para você.</p><div class="foot"><button class="btn primary" data-act="fechar">Entendi</button></div>`);
      break; }
    case 'trocar-senha': modalSenha(); break;
    case 'fechar': closeModal(); break;
    case 'tab': V.tab = a.dataset.v; if (V.so === 'encerradas') V.so = ''; lsSet(LS_TAB, V.tab); render(); break;
    case 'so': V.so = a.dataset.v; render(); break;
    case 'cad-tab': V.cad = a.dataset.v; render(); break;
    case 'limpar-exemplo':
      openModal(`<h2>Começar do zero?</h2><p class="muted" style="margin:0">Apaga demandas, ordens, fornecedores e veículos de exemplo deste aparelho. Seu usuário de gestor e as regras ficam.</p>
        <div class="foot"><button class="btn" data-act="fechar">Cancelar</button><button class="btn primary" data-act="confirma-limpar">Apagar exemplos</button></div>`); break;
    case 'confirma-limpar':
      S = { v:1, exemplo:false, config:S.config, users:[S.users.find(u => u.id === ME.id) || ME], veiculos:[], fornecedores:[], manutencoes:[], ordens:[], seq:{ M:0, OC:{} } };
      persist(); closeModal(); go('cadastros'); V.cad = 'veiculos'; render(); toast('Exemplos apagados. Cadastre veículos e fornecedores.'); break;
    /* nova demanda */
    case 'mv-tipo': document.getElementById('mv-tipo').value = a.dataset.v; document.querySelectorAll('[data-act=mv-tipo]').forEach(b => b.setAttribute('aria-pressed', b.dataset.v === a.dataset.v)); break;
    case 'd-placa': draft.placa = a.dataset.v; render(); break;
    case 'd-dest': if (draft.destino !== a.dataset.v) { draft.destino = a.dataset.v; draft.placa = (a.dataset.v !== 'estoque' && ME.placa && tipoPlaca(ME.placa) === a.dataset.v) ? ME.placa : ''; } render(); break;
    case 'd-tipo': draft.tipo = a.dataset.v; render(); break;
    case 'd-pri': draft.prioridade = a.dataset.v; render(); break;
    case 'rm-foto': draft.fotos.splice(+a.dataset.i, 1); render(); break;
    case 'ver-foto': {
      const [k, i] = a.dataset.src.split(/:(?=[^:]*$)/); let src;
      if (k === 'draft') src = draft.fotos[+i];
      else if (k.startsWith('m:')) src = manut(k.slice(2))?.fotos[+i];
      else if (k.startsWith('nf:')) src = ordem(k.slice(3))?.nf?.foto;
      if (src) openModal(`<div class="viewer"><img src="${src}" alt="Foto"></div><div class="foot"><button class="btn" data-act="fechar">Fechar</button></div>`);
      break; }
    case 'ver-anexo': { const q = c?.cotacoes.find(x => x.id === a.dataset.q); if (q?.anexo) openModal(`<div class="viewer"><img src="${q.anexo}" alt="Anexo da cotação"></div><div class="foot"><button class="btn" data-act="fechar">Fechar</button></div>`); break; }
    case 'forn-rapido': if (a.dataset.ret === 'cot') { /* mantém contexto */ } modalFornecedor(null, a.dataset.ret); break;
    /* demanda */
    case 'pri': await api.definirPrioridade(m, a.dataset.v); render(); toast(`Definida como ${a.dataset.v}.`); break;
    case 'atender': await api.atender(m); render(); toast('Atendimento assumido.'); break;
    case 'comentar': modalJustificar({ titulo:'Comentar', label:'Comentário', obrig:true, botao:'Salvar', onOk: async t => { await api.comentar(m, t); closeModal(); render(); } }); break;
    case 'cancelar-manut': modalJustificar({ titulo:'Cancelar demanda', texto:'A demanda sai da fila. OCs já geradas continuam valendo.', label:'Motivo', obrig:true, botao:'Cancelar demanda', onOk: async t => { await api.cancelarManut(m, t); closeModal(); go('fila'); toast('Demanda cancelada.'); } }); break;
    case 'cotar-nova': fornCtx = { m, c:null }; modalCotacao(m, null); break;
    case 'emerg': modalEmergencial(m); break;
    case 'cotar': fornCtx = { m, c }; modalCotacao(m, c); break;
    case 'nova-compra': modalNovaCompra(m); break;
    case 'escolher': await api.escolher(m, c, a.dataset.q); render(); break;
    case 'rm-cot': e.stopPropagation(); await api.removerCotacao(m, c, a.dataset.q); render(); break;
    case 'cancelar-compra': await api.cancelarCompra(m, c); render(); toast('Compra cancelada.'); break;
    case 'aprovar': case 'enviar': {
      const falta = +a.dataset.falta, naoMenor = a.dataset.naomenor === '1';
      const finalizar = async (just, disp) => {
        if (act === 'aprovar') { const oc = await api.aprovar(m, c, just, disp); closeModal(); toast(`${oc.num} gerada.`); go('oc', oc.id); }
        else { await api.enviarAprovacao(m, c, just, disp); closeModal(); render(); toast('Enviada para aprovação.'); }
      };
      if (falta > 0) modalJustificar({ titulo:'Dispensar cotações', texto:`A regra pede mais ${falta} cotação(ões) para este valor. A dispensa fica registrada no histórico.`, label:'Motivo da dispensa', obrig:true, botao: act === 'aprovar' ? 'Dispensar e aprovar' : 'Dispensar e enviar', onOk: t => finalizar(naoMenor ? t : c.justificativa, t) });
      else if (naoMenor) modalJustificar({ titulo:'Escolha diferente da menor', texto:'A cotação escolhida não é a mais barata. Diga o motivo para quem aprova.', label:'Justificativa', obrig:true, botao: act === 'aprovar' ? 'Aprovar e gerar OC' : 'Enviar para aprovação', onOk: t => finalizar(t, null) });
      else await finalizar(null, null);
      break; }
    case 'aprovar-direto': { const oc = await api.aprovar(m, c, null, null); toast(`${oc.num} gerada.`); go('oc', oc.id); break; }
    case 'reprovar': modalJustificar({ titulo:'Reprovar compra', texto:'A compra volta para cotação com o seu motivo.', label:'Motivo', obrig:true, botao:'Reprovar', onOk: async t => { await api.reprovar(m, c, t); closeModal(); render(); toast('Compra reprovada.'); } }); break;
    case 'encerrar': await api.encerrar(m); render(); toast('Manutenção encerrada.'); break;
    case 'reabrir': await api.reabrir(m); render(); break;
    /* ordens */
    case 'nf': modalNF(ordem(a.dataset.o)); break;
    case 'aceitar-div': await api.aceitarDivergencia(ordem(a.dataset.o)); render(); toast('Diferença aceita.'); break;
    case 'revisar': await api.revisarEmergencial(ordem(a.dataset.o)); render(); toast('Emergencial revisada.'); break;
    case 'copiar': {
      const t = a.dataset.v;
      try { await navigator.clipboard.writeText(t); toast('Número copiado.'); }
      catch (err) { const el = document.getElementById('oc-num'); if (el) { const r = document.createRange(); r.selectNodeContents(el); const s = getSelection(); s.removeAllRanges(); s.addRange(r); } toast('Número selecionado. Copie com o toque longo.'); }
      break; }
    case 'csv': exportCSV(); break;
    /* cadastros */
    case 'forn-edit': modalFornecedor(a.dataset.id ? forn(a.dataset.id) : null, null); break;
    case 'veic-edit': modalVeiculo(a.dataset.id ? S.veiculos.find(v => v.id === a.dataset.id) : null); break;
    case 'user-edit': modalUsuario(a.dataset.id ? user(a.dataset.id) : null); break;
    case 'user-senha': modalRedefinir(user(a.dataset.id)); break;
  }
  } catch (err) { console.error(err); toast(err.message || 'Algo deu errado. Tente de novo.', true); }
  finally { setBusy(false); }
});

document.addEventListener('submit', async e => {
  e.preventDefault();
  if (busy) return;
  setBusy(true);
  try { await onSubmit(e); }
  catch (err) { console.error(err); toast(err.message || 'Algo deu errado. Tente de novo.', true); }
  finally { setBusy(false); }
});
async function onSubmit(e){
  if (e.target.id === 'mform' && modalOnSubmit) return modalOnSubmit();
  if (e.target.id === 'form-nova') return submitNova();
  if (e.target.id === 'form-login') {
    loginErro = '';
    const ident = val('lg-email').trim();
    let email = ident;
    if (!ident.includes('@')) {
      const t = normTel(ident);
      if (!t) { loginErro = 'Digite o celular com DDD, por exemplo (15) 99999-0000.'; render(); setVal('lg-email', ident); return; }
      email = `${t}@${TEL_DOM}`;
    }
    const { data, error } = await sb.auth.signInWithPassword({ email, password: val('lg-senha') });
    if (error) { loginErro = error.message === 'Invalid login credentials' ? 'Celular ou senha incorretos.' : error.message; render(); setVal('lg-email', ident); return; }
    await entrarRemoto(data.user); return;
  }
  if (e.target.id === 'form-config') {
    const n = id => parseR(val(id)) ?? 0;
    const f1 = n('cf-f1'), f2 = n('cf-f2');
    if (f2 <= f1) return toast('O valor de 2 cotações precisa ser maior que o de 1 cotação.', true);
    await api.salvarConfig({ alcada: { motorista: n('cf-mot'), mecanico: n('cf-mec'), analista: n('cf-ana') },
      faixas: [ { ate: f1, n: 1 }, { ate: f2, n: 2 }, { ate: null, n: 3 } ],
      tetoEmergencial: n('cf-teto'), prazoRegularizacaoH: Math.max(1, Math.round(n('cf-prazo'))), toleranciaNF: n('cf-tol') });
    toast('Regras salvas.'); render();
  }
}

document.addEventListener('input', e => {
  const el = e.target;
  if (el.dataset.draft && draft) { draft[el.dataset.draft] = el.value; return; }
  if (el.id === 'busca-fila') { V.busca = el.value; const pos = el.selectionStart; render(); const n = document.getElementById('busca-fila'); n.focus(); n.setSelectionRange(pos, pos); }
  if (el.id === 'busca-oc') { V.ocBusca = el.value; const pos = el.selectionStart; render(); const n = document.getElementById('busca-oc'); n.focus(); n.setSelectionRange(pos, pos); }
});

document.addEventListener('change', async e => {
  const el = e.target;
  if (el.id === 'placa-fila' || el.id === 'placa-fila-m') { V.placa = el.value; render(); }
  if (el.id === 'd-emerg') { draft.emergencial = el.checked; render(); }
  if (el.id === 'd-forn') draft.fornecedorId = el.value;
  if (el.id === 'd-fotos') {
    const files = [...el.files].slice(0, 8);
    for (const f of files) { try { draft.fotos.push(await compressImage(f)); } catch (err) { toast('Não consegui ler uma das fotos.', true); } }
    render();
  }
  if (el.id === 'mc-anexo' && el.files[0]) { try { modalAnexo = await compressImage(el.files[0], 1400, 0.7); } catch (err) { toast('Não consegui ler o anexo.', true); } }
  if (el.id === 'nf-foto' && el.files[0]) { try { nfFoto = await compressImage(el.files[0], 1600, 0.72); } catch (err) { toast('Não consegui ler a foto da NF.', true); } }
});
document.addEventListener('keydown', e => { if (e.key === 'Escape' && document.querySelector('#modal-root .modal')) closeModal(); });

function exportCSV(){
  const cab = ['OC', 'Data aprovação', 'Placa / destino', 'Fornecedor', 'CNPJ', 'Manutenção', 'Descrição', 'Valor aprovado', 'NF', 'Valor NF', 'Situação', 'Emergencial', 'Aprovado por'];
  const linhas = visOrdens().map(o => { const m = manut(o.manutencaoId), c = m?.compras.find(x => x.id === o.compraId), f = forn(o.fornecedorId);
    return [o.num, fmtD(o.aprovadoEm), alvoTxt(o), f?.nome || '', f?.cnpj || '', m?.num || '', c?.descricao || '', String(o.valor.toFixed(2)).replace('.', ','),
      o.nf?.numero || '', o.nf ? String(o.nf.valor.toFixed(2)).replace('.', ',') : '', o.status, o.emergencial ? 'Sim' : 'Não', nomeU(o.aprovadoPor)]; });
  const csv = '﻿' + [cab, ...linhas].map(r => r.map(v => `"${String(v).replace(/"/g, '""')}"`).join(';')).join('\r\n');
  try {
    const url = URL.createObjectURL(new Blob([csv], { type:'text/csv;charset=utf-8' }));
    const a = document.createElement('a'); a.href = url; a.download = `ordens-de-compra-${new Date().toISOString().slice(0, 10)}.csv`;
    document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(url), 2000);
    toast('Planilha gerada.');
  } catch (err) { toast('Não foi possível baixar a planilha neste navegador.', true); }
}

/* ---------- início ---------- */
async function boot(){
  if (!REMOTE) {
    S = load();
    if (!S.config) S.config = defaultConfig();
    const id = lsGet(LS_USER); ME = id ? user(id) || null : null;
    if (ME) go('fila', null, { replace: true }); else render(); return;
  }
  S = { v:1, exemplo:false, config:defaultConfig(), users:[], veiculos:[], fornecedores:[], manutencoes:[], ordens:[], seq:{} };
  sb = window.supabase.createClient(CFG.supabaseUrl, CFG.supabaseAnonKey, { auth: { persistSession: true, autoRefreshToken: true } });
  sb.auth.onAuthStateChange((ev) => {
    if (ev === 'PASSWORD_RECOVERY') setTimeout(() => modalSenha(true), 300);
    if (ev === 'SIGNED_OUT') { ME = null; render(); }
  });
  document.getElementById('app').innerHTML = '<div class="login"><span class="muted">Carregando…</span></div>';
  const { data: { session } } = await sb.auth.getSession();
  if (session) await entrarRemoto(session.user); else render();
}
boot();
let lastW = window.innerWidth;
window.addEventListener('resize', () => { if ((lastW <= 820) !== (window.innerWidth <= 820)) render(); lastW = window.innerWidth; });
if ('serviceWorker' in navigator && location.protocol === 'https:') { try { navigator.serviceWorker.register('sw.js').catch(() => {}); } catch (e) {} }
</script>
